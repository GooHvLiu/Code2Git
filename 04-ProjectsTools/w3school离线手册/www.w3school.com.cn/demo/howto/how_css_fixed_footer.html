<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
.footer {
   position: fixed;
   left: 0;
   bottom: 0;
   width: 100%;
   background-color: red;
   color: white;
   text-align: center;
}
</style>
</head>
<body>

<h2>固定/粘性页脚实例</h2>
<p>页脚被放置在页面的底部。</p>

<div class="footer">
  <p>页脚</p>
</div>

</body>
