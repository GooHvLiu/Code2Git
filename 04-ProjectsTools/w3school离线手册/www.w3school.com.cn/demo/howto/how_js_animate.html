<!DOCTYPE html>
<html>
<style>
#myContainer {
  width: 400px;
  height: 400px;
  position: relative;
  background: #ccc;
}
#myAnimation {
  width: 50px;
  height: 50px;
  position: absolute;
  background-color: darkslateblue;
}
</style>

<!-- Mirrored from www.w3school.com.cn/demo/howto/how_js_animate.html by HTTrack Website Copier/3.x [XR&CO'2014], Fri, 20 Mar 2026 04:20:17 GMT -->
<body>

<p>
<button onclick="myMove()">点击我</button> 
</p>

<div id ="myContainer">
<div id ="myAnimation"></div>
</div>

<script>
var id = null;
function myMove() {
  var elem = document.getElementById("myAnimation");   
  var pos = 0;
  clearInterval(id);
  id = setInterval(frame, 10);
  function frame() {
    if (pos == 350) {
      clearInterval(id);
    } else {
      pos++; 
      elem.style.top = pos + 'px'; 
      elem.style.left = pos + 'px'; 
    }
  }
}
</script>

</body>

</html>
