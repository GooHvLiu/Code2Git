<!DOCTYPE html>
<html>

<head>
<meta charset="utf-8">
<script>
function validateForm() {
  var x = document.forms["myForm"]["fname"].value;
  if (x == "" || x == null) {
    alert("必须填写名字。");
    return false;
  }
}
</script>
</head>
<body>

<h2>JavaScript 验证空输入字段</h2>

<p>请尝试在不输入任何文本的情况下提交表单。</p>

<form name="myForm" action="https://www.w3school.com.cn/demo/action_page.php" onsubmit="return validateForm()" method="post" required>
  名字：<input type="text" name="fname">
  <input type="submit" value="Submit">
</form>

</body>
