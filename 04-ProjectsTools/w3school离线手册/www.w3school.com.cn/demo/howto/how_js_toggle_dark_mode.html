<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body {
  padding: 25px;
  background-color: white;
  color: black;
  font-size: 25px;
}

.dark-mode {
  background-color: black;
  color: white;
}
</style>
</head>
<body>

<h2>切换深色和浅色模式</h2>
<p>点击按钮可在此页面之间切换深色模式和浅色模式。</p>

<button onclick="myFunction()" style="padding: 8px 16px;">切换深色模式</button>

<script>
function myFunction() {
   var element = document.body;
   element.classList.toggle("dark-mode");
}
</script>

</body>
