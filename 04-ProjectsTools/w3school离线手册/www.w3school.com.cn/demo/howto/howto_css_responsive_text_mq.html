<!doctype html>
<html>

<head>
<meta charset="utf-8">
<title>响应式文本</title>
<style>
div.example {
  background-color: lightgrey;
  padding: 20px;
}

@media screen and (min-width: 601px) {
  div.example {
    font-size: 80px;
  }
}

@media screen and (max-width: 600px) {
  div.example {
    font-size: 30px;
  }
}
</style>
</head>

<body style="background-color: #f1f1f1;">

<div class="example" style="text-align: center;">
<p style="margin: 30px 0;">可变字体大小。</p>
<p style="margin: 18px 0;">请调整浏览器窗口的大小，看看字体大小是如何缩放的。</p>
</div>

</body>
