<head>
<meta charset="utf-8">
<style>
body
{
font-size:70%;
font-family:verdana,helvetica,arial,sans-serif;
}
</style>
<script>
function cnvs_getCoordinates(e)
{
x=e.clientX;
y=e.clientY;
document.getElementById("xycoordinates").innerHTML=" 坐标：(" + x + "," + y + ")";
}

function cnvs_clearCoordinates()
{
document.getElementById("xycoordinates").innerHTML="";
}
</script>
</head>
<body style="margin:0px;">

<div id="coordiv" style="float:left;width:199px;height:99px;border:1px solid #c3c3c3;margin-right: 10px;" onmousemove="cnvs_getCoordinates(event)" onmouseout="cnvs_clearCoordinates()"></div>
<br>
<br>
<br>
<div id="xycoordinates"></div>


</body>
