<!doctype html>
<html>

<!-- Mirrored from www.w3school.com.cn/demo/css/images_filters.html by HTTrack Website Copier/3.x [XR&CO'2014], Fri, 20 Mar 2026 04:18:41 GMT -->
<head>
<style>
img {
  width: 33%;
  height: auto;
  float: left; 
  max-width: 235px;
}

.blur {filter: blur(4px);}
.brightness {filter: brightness(250%);}
.contrast {filter: contrast(180%);}
.grayscale {filter: grayscale(100%);}
.huerotate {filter: hue-rotate(180deg);}
.invert {filter: invert(100%);}
.opacity {filter: opacity(50%);}
.saturate {filter: saturate(7);}
.sepia {filter: sepia(100%);}
.shadow {filter: drop-shadow(8px 8px 10px green);}
</style>
</head>
<body>

<!--
<p><b>注释：</b>Internet Explorer 或 Edge 12 不支持 filter 属性。</p>
-->

<img src="../../i/photo/tulip.jpg" alt="Coffee" width="300" height="300">
<img class="blur" src="../../i/photo/tulip.jpg" alt="Coffee" width="300" height="300">
<img class="brightness" src="../../i/photo/tulip.jpg" alt="Coffee" width="300" height="300">
<img class="contrast" src="../../i/photo/tulip.jpg" alt="Coffee" width="300" height="300">
<img class="grayscale" src="../../i/photo/tulip.jpg" alt="Coffee" width="300" height="300">
<img class="huerotate" src="../../i/photo/tulip.jpg" alt="Coffee" width="300" height="300">
<img class="invert" src="../../i/photo/tulip.jpg" alt="Coffee" width="300" height="300">
<img class="opacity" src="../../i/photo/tulip.jpg" alt="Coffee" width="300" height="300">
<img class="saturate" src="../../i/photo/tulip.jpg" alt="Coffee" width="300" height="300">
<img class="sepia" src="../../i/photo/tulip.jpg" alt="Coffee" width="300" height="300">
<img class="shadow" src="../../i/photo/tulip.jpg" alt="Coffee" width="300" height="300">

</body>

<!-- Mirrored from www.w3school.com.cn/demo/css/images_filters.html by HTTrack Website Copier/3.x [XR&CO'2014], Fri, 20 Mar 2026 04:18:41 GMT -->
</html>
