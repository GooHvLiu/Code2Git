<!DOCTYPE html>
<html lang="en">

<!-- Mirrored from www.w3school.com.cn/demo/bs/bs_carousel_1.html by HTTrack Website Copier/3.x [XR&CO'2014], Fri, 20 Mar 2026 04:19:06 GMT -->
<head>
  <title>Bootstrap 5 实例</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="../../lib/bs/bootstrap.css" rel="stylesheet">
  <script src="../../lib/bs/bootstrap.js"></script>
</head>

<body style="background-color: #fff;">

<!-- 轮播 -->
<div id="demo" class="carousel slide" data-bs-ride="carousel">

  <!-- 指标/点 -->
  <div class="carousel-indicators">
    <button type="button" data-bs-target="#demo" data-bs-slide-to="0" class="active"></button>
    <button type="button" data-bs-target="#demo" data-bs-slide-to="1"></button>
    <button type="button" data-bs-target="#demo" data-bs-slide-to="2"></button>
  </div>
  
  <!-- 幻灯片/轮播 -->
  <div class="carousel-inner">
    <div class="carousel-item active">
      <img src="../../i/photo/shanghai-1.jpg" alt="Shanghai" class="d-block" style="width:100%">
    </div>
    <div class="carousel-item">
      <img src="../../i/photo/beijing.jpg" alt="Beijing" class="d-block" style="width:100%">
    </div>
    <div class="carousel-item">
      <img src="../../i/photo/wuhan.jpg" alt="Wuhan" class="d-block" style="width:100%">
    </div>
  </div>
  
  <!-- 左右控件/图标 -->
  <button class="carousel-control-prev" type="button" data-bs-target="#demo" data-bs-slide="prev">
    <span class="carousel-control-prev-icon"></span>
  </button>
  <button class="carousel-control-next" type="button" data-bs-target="#demo" data-bs-slide="next">
    <span class="carousel-control-next-icon"></span>
  </button>
</div>

</body>

<!-- Mirrored from www.w3school.com.cn/demo/bs/bs_carousel_1.html by HTTrack Website Copier/3.x [XR&CO'2014], Fri, 20 Mar 2026 04:19:06 GMT -->
</html>
