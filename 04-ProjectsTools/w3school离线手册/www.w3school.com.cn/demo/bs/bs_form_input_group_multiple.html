<head>
  <title>Bootstrap 5 实例</title>
  <meta charset="utf-8">

  <link href="../../lib/bs/bootstrap.css" rel="stylesheet">
  <script src="../../lib/bs/bootstrap.js"></script>

<body style="background-color: #FCFDF8;">
  <!-- 多个输入控件 -->
  <div class="input-group mb-3">
    <span class="input-group-text">人名</span>
    <input type="text" class="form-control" placeholder="姓">
    <input type="text" class="form-control" placeholder="名">
  </div>

  <!-- 多个插件/帮助文本 -->
  <div class="input-group mb-3">
    <span class="input-group-text">一</span>
    <span class="input-group-text">二</span>
    <span class="input-group-text">三</span>
    <input type="text" class="form-control">
  </div>
</body>
