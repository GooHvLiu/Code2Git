  <title>Bootstrap 5 实例</title>
  <meta charset="utf-8">

<body style="background-color: #FCFDF8;">

<div class="container-fluid mt-3 w3-border w3-padding w3-round ws-grey">
    <div class="mb-3 mt-3">
      <label for="email" class="fxorm-label">电子邮件：</label>
      <input type="text" class="form-control"  style="margin-top:5px!important" id="email" placeholder="请输入电子邮件地址" name="email">
      <!--<div class="form-text">Must be a valid email address.</div>-->
    </div>
    <div class="mb-3">
      <label for="pwd" class="form-label">密码：</label>
      <input type="text" class="form-control" id="pwd" style="margin-top:5px!important"  placeholder="请输入密码" name="pswd">
    </div>
    <div class="form-check mb-3">
      <label class="form-check-label">
        <input class="form-check-input" type="checkbox" name="remember"> 记住我
      </label>
    </div>
    <button type="button" class="btn btn-primary mb-3">提交</button>
</div>

</body>
