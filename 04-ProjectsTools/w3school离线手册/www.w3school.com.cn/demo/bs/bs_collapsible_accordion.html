<!DOCTYPE html>
<html lang="en">

<head>
  <title>Bootstrap 5 实例</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="../../lib/bs/bootstrap.css" rel="stylesheet">
  <script src="../../lib/bs/bootstrap.js"></script>
</head>

<body style="background-color: #FCFDF8;">

<div class="container mt-3">
  <div id="accordion">
    <div class="card">
      <div class="card-header">
        <a class="btn" data-bs-toggle="collapse" href="#collapseOne">
          可折叠组项目 #1
        </a>
      </div>
      <div id="collapseOne" class="collapse show" data-bs-parent="#accordion">
        <div class="card-body">
          <h3>春日</h3>
		  <p>胜日寻芳泗水滨，无边光景一时新。</p>
          <p>等闲识得东风面，万紫千红总是春。</p>
        </div>
      </div>
    </div>
    <div class="card">
      <div class="card-header">
        <a class="collapsed btn" data-bs-toggle="collapse" href="#collapseTwo">
        可折叠组项目 #2
      </a>
      </div>
      <div id="collapseTwo" class="collapse" data-bs-parent="#accordion">
        <div class="card-body">
          <h3>初夏绝句</h3>
		  <p>纷纷红紫已成尘，布谷声中夏令新。</p>
          <p>夹路桑麻行不尽，始知身是太平人。</p>
        </div>
      </div>
    </div>
    <div class="card">
      <div class="card-header">
        <a class="collapsed btn" data-bs-toggle="collapse" href="#collapseThree">
          可折叠组项目 #3
        </a>
      </div>
      <div id="collapseThree" class="collapse" data-bs-parent="#accordion">
        <div class="card-body">
          <h3>山行</h3>
		  <p>远上寒山石径斜，白云生处有人家。</p>
          <p>停车坐爱枫林晚，霜叶红于二月花。</p>
        </div>
      </div>
    </div>
  </div>
</div>

</body>

<!-- Mirrored from www.w3school.com.cn/demo/bs/bs_collapsible_accordion.html by HTTrack Website Copier/3.x [XR&CO'2014], Fri, 20 Mar 2026 04:19:05 GMT -->
</html>
