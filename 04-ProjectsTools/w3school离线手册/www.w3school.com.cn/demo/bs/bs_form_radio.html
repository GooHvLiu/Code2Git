<body style="background-color: #FCFDF8;">
  <div class="form-check">
    <label class="form-check-label" for="radio1" style="margin-left:5px;">
      <input type="radio" class="form-check-input" id="radio1" name="optradio" value="option1" checked>选项 1
    </label>
  </div>
  <div class="form-check">
    <label class="form-check-label" for="radio2" style="margin-left:5px;">
      <input type="radio" class="form-check-input" id="radio2" name="optradio" value="option2">选项 2
    </label>
  </div>
  <div class="form-check">
    <label class="form-check-label" style="margin-left:5px;">
      <input type="radio" class="form-check-input" disabled>选项 3
    </label>
  </div>
