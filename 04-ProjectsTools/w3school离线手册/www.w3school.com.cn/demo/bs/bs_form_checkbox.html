<head>
  <title>Bootstrap 5 实例</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="../../lib/bs/bootstrap.css" rel="stylesheet">
  <script src="../../lib/bs/bootstrap.js"></script>

<body style="background-color: #FCFDF8;">
  <div class="form-check mb-3" style="margin-left:5px;">
    <label class="form-check-label">
      <input class="form-check-input" type="checkbox" checked> 选项 1
    </label>
  </div>
  <div class="form-check mb-3" style="margin-left:5px;">
    <label class="form-check-label">
      <input class="form-check-input" type="checkbox"> 选项 2
    </label>
  </div>
  <div class="form-check mb-3" style="margin-left:5px;">
    <label class="form-check-label">
      <input class="form-check-input" type="checkbox" disabled> 禁用选项
    </label>
  </div>
</body>
