<body style="background-color: #FCFDF8;">

<div class="container mt-3">
  <p class="bg-primary text-white">此文本很重要。</p>

  <p class="bg-info text-white">此文本代表了一些信息。</p>

  <p class="bg-dark text-white">深灰色背景颜色。</p>
