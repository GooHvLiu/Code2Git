<body>

<h1>这是标题</h1>

<p>这是一个段落。</p>

<p id="footer">这是一个页脚段落。</p>

<button type="button" onclick="myFunction()">在页脚段落之后设置分页</button>

<p>请点击上面的按钮，并在打印或打印预览中查看更改。</p>

<script>
function myFunction() {
  document.getElementById("footer").style.pageBreakAfter = "always";
}
</script>

</body>
