<body>

<h1>这是标题</h1>

<p>这是一个段落。</p>

<p id="footer">这是一个页脚段落。</p>

<button type="button" onclick="myFunction()">避免在页脚段落内分页</button>

<script>
function myFunction() {
  document.getElementById("footer").style.pageBreakInside = "avoid";
}
</script>

</body>
