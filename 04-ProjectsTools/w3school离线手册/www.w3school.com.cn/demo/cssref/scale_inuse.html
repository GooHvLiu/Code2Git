<!DOCTYPE html>
<html>

<!-- Mirrored from www.w3school.com.cn/demo/cssref/scale_inuse.html by HTTrack Website Copier/3.x [XR&CO'2014], Fri, 20 Mar 2026 05:26:23 GMT -->
<head>
<meta charset="utf-8">

<style>
#div1
{
position: relative;
height: 200px;
width: 200px;
margin: 30px;
padding:30px;
border: 1px solid black;
}

#div2
{
padding:50px;
position: absolute;
border: 1px solid black;
background-color: red;
}
</style>
<script>

function changeOrg()
{
var x=document.getElementById('ox').value;
var y=document.getElementById('oy').value;
document.getElementById('div2').style.scale=x + ' ' + y;
document.getElementById('origin').innerHTML=x + ' ' + y;     
}
</script>
</head>

<body>

<p>缩放红色的 div 元素，尝试改变其 X 轴和 Y 轴的值。</p>

<div id="div1">
  <div id="div2">HELLO</div>
</div>

<p>缩放</p>
<p>
  X 轴:<input type="range" min="-2" max="2" value="1" step="0.1" oninput="changeOrg()" id="ox" />
</p>
<p>
  Y 轴:<input type="range" min="-2" max="2" value="1" step="0.1" oninput="changeOrg()" id="oy" />
</p>
<p>
  缩放比例: <span id="origin">1 1</span>;
</p>

 
</body>

<!-- Mirrored from www.w3school.com.cn/demo/cssref/scale_inuse.html by HTTrack Website Copier/3.x [XR&CO'2014], Fri, 20 Mar 2026 05:26:23 GMT -->
</html>
