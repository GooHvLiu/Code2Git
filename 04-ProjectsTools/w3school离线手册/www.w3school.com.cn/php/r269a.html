<h1>正则表达式修饰符：cat|dog|fish</h1>

<p>在文本 "We have three dogs, one fish, but no cats" 中，"cat"、"dog" 或 "fish" 出现了多少次：</p>

3  

<p>匹配到的位置如下：</p>

We have three #s, one #, but no #s  

<p>（每个匹配项都被替换为 # 字符）</p>
