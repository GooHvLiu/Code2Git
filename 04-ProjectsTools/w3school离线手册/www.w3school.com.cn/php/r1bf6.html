<h1>正则表达式修饰符：o{2,5}</h1>

<p>在文本 "W3School is gooood" 中，有多少个至少连续出现 2 个 o（oo），但不超过 5 个 o（ooooo）的情况？</p>

2  

<p>匹配到的位置如下：</p>

W3Sch#l is g#d  

<p>（每个匹配项被替换为 # 字符）</p>
