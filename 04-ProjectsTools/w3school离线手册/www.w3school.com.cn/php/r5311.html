<p>模式 1 将返回一个数组，其中 ASCII 值作为键，出现次数作为值（例如，在此示例中，字母 "l" 的 ASCII 值为 108，它出现了三次。空格符的 ASCII 值为 32）：</p>

Array
(
    [32] => 1
    [33] => 1
    [72] => 1
    [87] => 1
    [100] => 1
    [101] => 1
    [108] => 3
    [111] => 2
    [114] => 1
)
