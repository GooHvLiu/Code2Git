<body>

<pre>
object(stdClass)#1 (3) {
  ["0"]=>
  string(5) "Volvo"
  ["1"]=>
  string(3) "BMW"
  ["2"]=>
  string(6) "Toyota"
}
object(stdClass)#2 (3) {
  ["Peter"]=>
  string(2) "35"
  ["Ben"]=>
  string(2) "37"
  ["Joe"]=>
  string(2) "43"
}
 
</pre>

<p>索引数组转换为对象时，索引号作为属性名，值作为属性值。</p>

<p>关联数组转换为对象时，键作为属性名，值作为属性值。</p>

</body>
