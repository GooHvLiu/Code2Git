<h1>!== 运算符</h1>

<p>比较两个变量，如果它们不完全相同，则输出一条消息。</p>

<p>不全等运算符 (!==) 会检查值和数据类型，而不等运算符 (!=) 只检查值。</p>

100 与 50 不完全相同
