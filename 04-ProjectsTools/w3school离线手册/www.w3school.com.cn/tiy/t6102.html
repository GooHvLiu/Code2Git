<!DOCTYPE html>
<html>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css?family=Raleway" rel="stylesheet">
<style>
* {
  box-sizing: border-box;
}

body {
  background-color: #f1f1f1;
}

#regForm {
  background-color: #ffffff;
  margin: 100px auto;
  font-family: Raleway;
  padding: 40px;
  width: 70%;
  min-width: 300px;
}

h1 {
  text-align: center;  
}

input {
  padding: 10px;
  width: 100%;
  font-size: 17px;
  font-family: Raleway;
  border: 1px solid #aaaaaa;
}

/* 标记验证时出错的输入框： */
input.invalid {
  background-color: #ffdddd;
}

/* 默认隐藏所有步骤： */
.tab {
  display: none;
}

button {
  background-color: #04AA6D;
  color: #ffffff;
  border: none;
  padding: 10px 20px;
  font-size: 17px;
  font-family: Raleway;
  cursor: pointer;
}

button:hover {
  opacity: 0.8;
}

#prevBtn {
  background-color: #bbbbbb;
}

/* 创建指示表单步骤的圆圈： */
.step {
  height: 15px;
  width: 15px;
  margin: 0 2px;
  background-color: #bbbbbb;
  border: none;  
  border-radius: 50%;
  display: inline-block;
  opacity: 0.5;
}

.step.active {
  opacity: 1;
}

/* 标记已完成且有效的步骤： */
.step.finish {
  background-color: #04AA6D;
}
</style>
<body>

<form id="regForm" action="https://www.w3school.com.cn/demo/action_page.php">
  <h1>Register:</h1>
  <!-- One "tab" for each step in the form: -->
  <div class="tab">Name:
    <p><input placeholder="First name..." oninput="this.className = ''" name="fname"></p>
    <p><input placeholder="Last name..." oninput="this.className = ''" name="lname"></p>
  </div>
  <div class="tab">Contact Info:
    <p><input placeholder="E-mail..." oninput="this.className = ''" name="email"></p>
    <p><input placeholder="Phone..." oninput="this.className = ''" name="phone"></p>
  </div>
  <div class="tab">Birthday:
    <p><input placeholder="dd" oninput="this.className = ''" name="dd"></p>
    <p><input placeholder="mm" oninput="this.className = ''" name="nn"></p>
    <p><input placeholder="yyyy" oninput="this.className = ''" name="yyyy"></p>
  </div>
  <div class="tab">Login Info:
    <p><input placeholder="Username..." oninput="this.className = ''" name="uname"></p>
    <p><input placeholder="Password..." oninput="this.className = ''" name="pword" type="password"></p>
  </div>
  <div style="overflow:auto;">
    <div style="float:right;">
      <button type="button" id="prevBtn" onclick="nextPrev(-1)">Previous</button>
      <button type="button" id="nextBtn" onclick="nextPrev(1)">Next</button>
    </div>
  </div>
  <!-- 用于指示表单步骤的圆圈： -->
  <div style="text-align:center;margin-top:40px;">
    <span class="step"></span>
    <span class="step"></span>
    <span class="step"></span>
    <span class="step"></span>
  </div>
</form>

<script>
var currentTab = 0; // 当前标签页设置为第一个标签页 (0)
showTab(currentTab); // 显示当前标签页

function showTab(n) {
  // 此函数将显示表单的指定标签页 ...
  var x = document.getElementsByClassName("tab");
  x[n].style.display = "block";
  // ... 并修复上一个/下一个按钮：
  if (n == 0) {
    document.getElementById("prevBtn").style.display = "none";
  } else {
    document.getElementById("prevBtn").style.display = "inline";
  }
  if (n == (x.length - 1)) {
    document.getElementById("nextBtn").innerHTML = "Submit";
  } else {
    document.getElementById("nextBtn").innerHTML = "Next";
  }
  // ... 并运行一个函数，显示正确的步骤指示器： 
  fixStepIndicator(n)
}

function nextPrev(n) {
  // 此函数将确定要显示哪个标签页：
  var x = document.getElementsByClassName("tab");
  // 如果当前标签页中的任何字段无效，则退出该函数：
  if (n == 1 && !validateForm()) return false;
  // 隐藏当前标签页：
  x[currentTab].style.display = "none";
  // 将当前标签页增加或减少 1：
  currentTab = currentTab + n;
  // 如果您已到达表格末尾...：
  if (currentTab >= x.length) {
    //...表单将被提交：
    document.getElementById("regForm").submit();
    return false;
  }
  // 否则，显示正确的标签页：
  showTab(currentTab);
}

function validateForm() {
  // 该函数处理表单字段的验证
  var x, y, i, valid = true;
  x = document.getElementsByClassName("tab");
  y = x[currentTab].getElementsByTagName("input");
  // 检查当前标签页中每个输入字段的循环：
  for (i = 0; i < y.length; i++) {
    // 如果字段为空...
    if (y[i].value == "") {
      // 将 "invalid" 类添加到该字段：
      y[i].className += " invalid";
      // 并将当前有效状态设置为 false：
      valid = false;
    }
  }
  // 如果有效状态为 true，则将该步骤标记为已完成且有效：
  if (valid) {
    document.getElementsByClassName("step")[currentTab].className += " finish";
  }
  return valid; // return the valid status
}

function fixStepIndicator(n) {
  // 此函数删除所有步骤的 "active" 类...
  var i, x = document.getElementsByClassName("step");
  for (i = 0; i < x.length; i++) {
    x[i].className = x[i].className.replace(" active", "");
  }
  //... 并将 "active" 类添加到当前步骤：
  x[n].className += " active";
}
</script>

</body>

function colorcoding() {
  var ua = navigator.userAgent;
  //Opera Mini refreshes the page when trying to edit the textarea.
  if (ua && ua.toUpperCase().indexOf("OPERA MINI") > -1) { return false; }
  window.editor = CodeMirror.fromTextArea(document.getElementById("textareaCode"), {
    mode: 'text/html',
    htmlMode: true,
    lineWrapping: true,
    smartIndent: false,
    addModeClass: true
  });
//  window.editor.on("change", function () {window.editor.save();});
}
colorcoding();
</script>


<script>
var currentStack=true;
if ((window.screen.availWidth <= 768 && window.innerHeight > window.innerWidth) || "" == " horizontal") {restack(true);}
function restack(vertical) {
    var tc, ic, t, i, c, n, f, sv, sh, d, height, flt, width;
    tc = document.getElementById("textareacontainer");
    ic = document.getElementById("iframecontainer");
    t = document.getElementById("textarea");
    i = document.getElementById("iframe");
    c = document.getElementById("container");
    n = document.getElementById("navfirst");
    //sv = document.getElementById("stackV");
    //sh = document.getElementById("stackH");
    tc.className = tc.className.replace("horizontal", "");
    ic.className = ic.className.replace("horizontal", "");
    t.className = t.className.replace("horizontal", "");
    i.className = i.className.replace("horizontal", "");
    c.className = c.className.replace("horizontal", "");
    n.className = n.className.replace("horizontal", "");
    //if (sv) {sv.className = sv.className.replace("horizontal", "")};
    //if (sv) {sh.className = sh.className.replace("horizontal", "")};
    //stack = "";
    if (vertical) {
        tc.className = tc.className + " horizontal";
        ic.className = ic.className + " horizontal";        
        t.className = t.className + " horizontal";        
        i.className = i.className + " horizontal";
        c.className = c.className + " horizontal";
        n.className = n.className + " horizontal";
        //if (sv) {sv.className = sv.className + " horizontal"};
        //if (sv) {sh.className = sh.className + " horizontal"};
        //stack = " horizontal";
        document.getElementById("textareacontainer").style.height = "50%";
        document.getElementById("iframecontainer").style.height = "50%";
        document.getElementById("textareacontainer").style.width = "100%";
        document.getElementById("iframecontainer").style.width = "100%";
        currentStack=false;
    } else {
        document.getElementById("textareacontainer").style.height = "100%";
        document.getElementById("iframecontainer").style.height = "100%";
        document.getElementById("textareacontainer").style.width = "50%";
        document.getElementById("iframecontainer").style.width = "50%";
        currentStack=true;        
    }
}
</script>


<script>
function retheme() {
  var cc = document.body.className;
  if (cc.indexOf("darktheme") > -1) {
    document.body.className = cc.replace("darktheme", "");
  } else {
    document.body.className += " darktheme";
  }
}
</script>
