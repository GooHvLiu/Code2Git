<!DOCTYPE html>
<html>
<title>按数字对 HTML 列表进行排序</title>
<body>

<p>点击按钮可按数字顺序排序列表：</p>
<button onclick="sortList()">排序</button>

<ul id="id01">
  <li>4</li>
  <li>3</li>
  <li>1</li>
  <li>7</li>
  <li>1000</li>
  <li>5234234</li>
  <li>2</li>
  <li>100</li>
</ul>

<script>
function sortList() {
  var list, i, switching, b, shouldSwitch;
  list = document.getElementById("id01");
  switching = true;
  /* 创建一个循环，直到没有交换发生: */
  while (switching) {
    // 首先说：没有交换发生：
    switching = false;
    b = list.getElementsByTagName("LI");
    // 遍历所有列表项：
    for (i = 0; i < (b.length - 1); i++) {
      // 首先说不应该交换：
      shouldSwitch = false;
      /* 检查下一个项目是否应该与当前项目调换位置: */
      
      if (Number(b[i].innerHTML) > Number(b[i + 1].innerHTML)) {
        /* 如果下一个项目在数值上低于当前项目，标记为交换
        并跳出循环: */
        shouldSwitch = true;
        break;
      }
    }
    if (shouldSwitch) {
      /* 如果标记了交换，则执行交换并标记交换为完成: */
      b[i].parentNode.insertBefore(b[i + 1], b[i]);
      switching = true;
    }
  }
}
</script>

</body>

var currentStack=true;

    c.className = c.className.replace("horizontal", "");
    n.className = n.className.replace("horizontal", "");

        i.className = i.className + " horizontal";

        n.className = n.className + " horizontal";
        //if (sv) {sv.className = sv.className + " horizontal"};
        //if (sv) {sh.className = sh.className + " horizontal"};
        //stack = " horizontal";
        document.getElementById("textareacontainer").style.height = "50%";

<script>
function retheme() {
  var cc = document.body.className;
  if (cc.indexOf("darktheme") > -1) {
    document.body.className = cc.replace("darktheme", "");
  } else {
    document.body.className += " darktheme";
  }
}
</script>
