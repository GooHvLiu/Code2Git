<h1>红楼梦</h1>

<a href="#section1">第一回 甄士隐梦幻识通灵 贾雨村风尘怀闺秀</a>
<br>
<a href="#section2">第二回 贾夫人仙逝扬州城 冷子兴演说荣国府</a>

<h2 id="section1">第一回 甄士隐梦幻识通灵 贾雨村风尘怀闺秀</h2>

<p>此开卷第一回也。作者自云，因曾历过一番梦幻之后，故将真事隐去，而借“通灵”之说，撰此《石头记》一书也。故曰“甄士隐”云云。但书中所记何事何人，自又云，今风尘碌碌一事无成，忽念及当日所有之女子，一一细考较去，觉其行止见识皆出于我之上，何我堂堂须眉诚不若彼裙钗哉，实愧则有馀，悔又无益之大无可如何之日也。当此时，自欲将已往所赖天恩祖德，锦衣纨袴之时，饫甘餍肥之日，背父兄教育之恩，负师友规谈之德，以致今日一技无成半生潦倒之罪，编述一集以告天下人，虽我之罪固不能免，然闺阁中本自历历有人，万不可因我之不肖，自护己短，一并使其泯灭也。虽今日之茅椽蓬牖，瓦灶绳床，其风晨月夕，阶柳庭花，亦未有妨我之襟怀笔墨者，虽我未学，下笔无文，又何妨用假语村言敷演出一段故事来，以悦人之耳目哉。故曰“贾雨村”云云。乃是第一回题纲正义也。开卷即云“风尘怀闺秀”，则知作者本意原为记述当日闺友闺情，并非怨世骂时之书矣；虽一时有涉于世态，然亦不得不叙者，但非其本旨耳。阅者切记之。诗曰：</p>

<p>浮生着甚苦奔忙，盛席华筵终散场。悲喜千般同幻泡，古今一梦尽荒唐。谩言红袖啼痕重，更有情痴抱恨长。字字看来皆是血，十年辛苦不寻常。</p>

<p>列位看官，你道此书何来，说起根由虽近荒唐，细按则深有趣味，待在下将此来历注明，方使阅者了然不惑。</p>

<p>原来女娲氏炼石补天[1]之时，于大荒山无稽崖炼成高经十二丈，方经二十四丈顽石三万六千五百零一块。娲皇氏只用了三万六千五百块，只单单的剩了一块未用，便弃在此山青埂峰下。谁知此石自经煅炼之后，灵性已通，因见众石俱得补天，独自己无材不堪入选，遂自怨自叹，日夜悲号惭愧。</p>

<p>一日正当嗟悼之际，俄见一僧一道远远而来，生得骨格不凡，丰神迥别，说说笑笑来至峰下，坐于石边，高谈快论。先是说些云山雾海神仙玄幻之事；后便说到红尘中荣华富贵。此石听了，不觉打动凡心，也想要到人间去享一享这荣华富贵；但自恨粗蠢，不得已便口吐人言，向那僧道说道：“大师，弟子蠢物不能见礼了。适闻二位谈那人世间荣耀繁华，心切慕之。弟子质虽粗蠢，性却稍通，况见二师仙形道体，定非凡品，必有补天济世之材，利物济人之德，如蒙发一点慈心，携带弟子得入红尘，在那富贵场中温柔乡里受享几年，自当永佩洪恩，万劫不忘也。”二仙师听毕，齐憨笑道：“善哉，善哉。那红尘中却有些乐事，但不能永远依恃；况又有‘美中不足，好事多魔’八个字紧相联属，瞬息间则又乐极悲生，人非物换，究竟是到头一梦，万境归空，倒不如不去的好。”</p>

<p>这石凡心已炽，那里听得进这话去，乃复苦求再四。二仙知不可强制，乃叹道：“此亦静极思动，无中生有之数也。既如此，我们便携你去受享受享，只是到不得意时，切莫后悔。”石道：“自然，自然。”那僧又道：“若说你性灵，却又如此质蠢，并更无奇贵之处，如此也只好踮脚而已。也罢，我如今大施佛法助你助，待劫终之日，复还本质，以了此案。你道好否？”石头听了，感谢不尽。那僧便念咒书符，大展幻术，将一块大石登时变成一块鲜明莹洁的美玉，且又缩成扇坠大小的可佩可拿。那僧托于掌上，笑道：“形体倒也是个宝物了，还只没有实在的好处，须得再镌上数字，使人一见便知是奇物方妙；然后好携你到那昌明隆盛之邦，诗礼簪缨之族，花柳繁华地，温柔富贵乡去安身乐业。”石头听了，喜之不尽，乃问道：“不知赐了弟子那几件奇处，又不知携了弟子到何地方，望乞明示，使弟子不惑。”那僧笑道：“你且莫问，日后自然明白的。”说着便袖笼了这石，同那道人飘然而去，竟不知投奔何方何舍。</p>

<p>后来又不知过了几世几劫[2]，因有个空空道人访道求仙，从这大荒山无稽崖青埂峰下经过，忽见大块石上字迹分明，编述历历。空空道人乃从头一看，原来就是无材补天，幻形入世，蒙茫茫大士渺渺真人携入红尘，历尽离合悲欢炎凉世态的一段故事，后面又有一首偈云：</p>

<p>无材可去补苍天，枉入红尘若许年。</p>

<p>此系身前身后事，倩谁记去作奇传。</p>

<p>诗后便是此石坠落之乡，投胎之处，亲自经历的一段陈迹故事。其中家庭闺阁琐事以及闲情诗词倒还全备，或可适趣解闷，然朝代年纪地舆邦国，却反失落无考。空空道人遂向石头说道：“石兄，你这一段故事，据你自己说有些趣味，故编写在此，意欲问世传奇。据我看来，第一件无朝代年纪可考，第二件并无大贤大忠理朝廷治风俗的善政；其中只不过几个异样女子，或情或痴，或小才微善，亦无班姑蔡女之德能。我纵抄去，恐世人不爱看呢。”石头笑答曰：“我师何太痴也！若云无朝代可考，今我师竟假借汉唐等年纪添缀，又有何难。但我想历来野史皆蹈一辙，莫如我不借此套者反倒新奇别致，不过只取其事体情理罢了，又何必拘拘于朝代年纪哉。再者，市井俗人喜看理治之书者甚少，爱看适趣闲文者特多。历来野史，或讪谤君相，或贬人妻女，奸淫凶恶不可胜数；更有一种风月笔墨，其淫污秽臭，荼毒笔墨，坏人子弟，又不可胜数；至若佳人才子等书，则又千部共出一套，且其中终不能不涉于淫滥，以致满纸潘安子建西子文君，不过作者要写出自己的那两首情诗艳赋来，故假拟出男女二人名姓，又必旁出一小人其间拨乱，亦如剧中之小丑然，且鬟婢开口，即者也之乎非文即理。故逐一看去，悉皆自相矛盾大不近情理之说，竟不如我半世亲睹亲闻的这几个女子，虽不敢说强似前代所有书中之人，但事迹原委亦可以消愁破闷，也有几首歪诗熟词可以喷饭供酒；至若离合悲欢，兴衰际遇，则又追踪蹑迹，不敢稍加穿凿，徒为哄人之目而反失其真传者。今之人，贫者日为衣食所累，富者又怀不足之心，纵一时稍闲，又有贪淫恋色好货寻愁之事，那里有工夫去看那理治之书。所以我这一段故事，也不愿世人称奇道妙，也不定要世人喜悦检读，只愿他们当那醉馀饱卧之时，或避世去愁之际，把此一顽，岂不省了些寿命筋力，就比那谋虚逐妄，却也省了口舌是非之害，腿脚奔忙之苦；再者亦令世人换新眼目，不比那些胡牵乱扯，忽离忽遇，满纸才人淑女子建文君红娘小玉等，通共熟套之旧稿。我师以为何如？”</p>

<p>空空道人听如此说，思忖半晌，将这《石头记》再细阅一遍，因见上面虽有些指奸责佞贬恶诛邪之语，亦非伤时骂世之旨；乃至君仁臣良父慈子孝，凡伦常所关之处，皆是称功颂德眷眷无穷，实非别书之可比。虽其中大旨谈情，亦不过实录其事，又非假拟妄称，一味淫邀艳约私讨偷盟之可比。因毫不干涉时世，方从头至尾抄录回来，问世传奇；因空见色，由色生情，传情入色，自色悟空，遂易名为情僧，改“石头记”为“情僧录”。东鲁孔梅溪则题曰“风月宝鉴”。后因曹雪芹于悼红轩中披阅十载，增删五次，纂成目录，分出章回，则题曰“金陵十二钗”。并题一绝云：</p>

<p>满纸荒唐言，一把辛酸泪。</p>

<p>都云作者痴，谁解其中味。</p>

<p>出则既明，且看石上是何故事。按那石上书云：当日地陷东南，这东南一隅有处曰姑苏，有城曰阊门者，最是红尘中一二等富贵风流之地。这阊门外有个十里街，街内有个仁清巷，巷内有个古庙，因地方窄狭，人皆呼作葫芦庙。庙旁住着一家乡宦，姓甄，名费，字士隐。嫡妻封氏，情性贤淑，深明礼义。家中虽不甚富贵，然本地便也推他为望族了。因这甄士隐禀性恬淡，不以功名为念，每日只以观花修竹酌酒吟诗为乐，倒是神仙一流人品。只是一件不足，如今年已半百，膝下无儿，只有一女，乳名英莲，年方三岁。</p>

<p>一日，炎夏永昼，士隐于书房闲坐，至手倦抛书，伏几少憩，不觉朦胧睡去，梦至一处，不辨是何地方。忽见那厢来了一僧一道，且行且谈。只听道人问道：“你携了这蠢物，意欲何往？”那僧笑道：“你放心，如今现有一段风流公案正该了结，这一干风流冤家尚未投胎入世，趁此机会就将此蠢物夹带于中，使他去经历经历。”那道人道：“原来近日风流冤孽又将造劫历世去不成。但不知落于何方何处？”那僧笑道：“此事说来好笑，竟是千古未闻的罕事。只因西方灵河岸上三生石畔有绛珠草一株，时有赤瑕宫神瑛侍者日以甘露灌溉，这绛珠草始得久延岁月。后来既受天地精华，复得雨露滋养，遂得脱却草胎木质得换人形，仅修成个女体，终日游于离恨天外，饥则食蜜青果为膳，渴则饮灌愁海水为汤；只因尚未酬报灌溉之德，故其五衷便郁结着一段缠绵不尽之意。恰近日这神瑛侍者凡心偶炽，乘此昌明太平朝世，意欲下凡，造历幻缘，已在警幻仙子案前挂了号。警幻亦曾问及灌溉之情未偿，趁此倒可了结的。那绛珠仙子道：‘他是甘露之惠，我并无水可还。他既下世为人，我也去下世为人，但把我一生所有的眼泪还他，也偿还得过他了。’因此一事，就勾出多少风流冤家来，陪他们去了结此案。”那道人道：“果是罕闻，实未闻有还泪之说。想来这一段故事比历来风月故事更加琐碎细腻了。”那僧道：“历来几个风流人物，不过传其大概以及诗词篇章而已，至家庭闺阁中一饮一食总未述记；再者，大半风月故事，不过偷香窃玉暗约私奔而已，并不曾将儿女之真情发泄一二。想这一干人入世，其情痴色鬼贤愚不肖者，悉与前人传述不同矣。”那道人道：“趁此何不你我也去下世度脱几个，岂不是一场功德。”那僧道：“正合吾意。你且同我到警幻仙子宫中将这蠢物交割清楚。待这一干风流孽鬼下世已完，你我再去。如今虽已有一半落尘，然犹未全集。”道人道：“既如此，便随你去来。”
</p>
<p>却说甄士隐俱听得明白，但不知所云蠢物系何东西，遂不禁上前施礼，笑问道：“二仙师请了。”那僧道也答礼相问。士隐因说道：“适闻仙师所谈因果实人世罕闻者，但弟子愚浊不能洞悉明白，若蒙大开痴顽，备细一闻，弟子则洗耳谛听，稍能警省，亦可免沉沦之苦。”二仙笑道：“此乃玄机[3]不可预泄者，到那时只不要忘了我二人，便可跳出火坑矣。”士隐听了，不便再问，因笑道：“玄机不可预泄，但适云蠢物不知为何，或可一见否？”那僧道：“若问此物，倒有一面之缘。”说着，取出递与士隐。士隐接了看时，原是块鲜明美玉，上面字迹分明，镌着“通灵宝玉”四字，后面还有几行小字。正欲细看时，那僧便说已到幻境，便强从手中夺了去，与道人竟过一大石牌坊，上书四个大字乃是“太虚幻境”，两边又有一副对联，道是：</p>

<p>假作真时真亦假，无为有处有还无。</p>

<p>士隐意欲也跟了过去，方举步时，忽听一声霹雳，有若山崩地陷。士隐大叫一声，定睛一看，只见烈日炎炎，芭蕉冉冉，梦中之事便忘了对半。又见奶母正抱了英莲走来。士隐见女儿越发生得粉妆玉琢，乖觉可喜，便伸手接来，抱在怀中，逗他顽耍一回，又带至街前，看那过会的热闹。方欲进来时，只见从那边来了一僧一道，那僧则癞头跣脚，那道则跛足蓬头，疯疯颠颠，挥霍谈笑而至。及到了他门前，看见士隐抱着英莲，那僧便大哭起来，又向士隐道：“施主，你把这有命无运累及爹娘之物，抱在怀内作甚！”士隐听了，知是疯话，也不去睬他。那僧还说：“舍我罢，舍我罢！”士隐不耐烦，便抱女儿撤身要进去，那僧乃指着他大笑，口内念了四句言词道：</p>

<p>惯养娇生笑你痴，菱花空对雪澌澌。</p>

<p>好防佳节元宵后，便是烟消火灭时。</p>

<p>士隐听得明白，心下犹豫，意欲问他们来历，只听道人说道：“你我不必同行，就此分手，各干营生去罢。三劫后，我在北邙山等你，会齐了，同往太虚幻境销号。”那僧道：“最妙，最妙。”说毕，二人一去，再不见个踪影了。士隐心中此时自忖，这两个人必有来历，该试一问，如今悔却晚也。</p>

<p>这士隐正痴想，忽见隔壁葫芦庙内，寄居一个穷儒，姓贾名化，表字时飞，别号雨村者，走了出来。这贾雨村原系湖州人氏，也是诗书仕宦之族，因他生于末世，父母祖宗根基已尽，人口衰丧，只剩得他一身一口，在家乡无益，因进京求取功名，再整基业。自前岁来此，又淹蹇[4]住了，暂寄庙中安身每日卖字作文为生，故士隐常与他交接。</p>

<p>当下雨村见了士隐，忙施礼陪笑道：“老先生倚门伫望，敢街市上有甚新闻否？”士隐笑道：“非也。适因小女啼哭，引他出来作耍，正是无聊之甚。兄来得正妙，请入小斋一谈，彼此皆可消此永昼。”说着便令人送女儿进去，自携了雨村来至书房中。小童献茶，方谈得三五句话，忽家人飞报严老爷来拜。士隐慌的忙起身谢罪道：“恕诳驾之罪，略坐，弟即来陪。”雨村忙起身亦让道：“老先生请便。晚生乃常造之客，稍候何妨。”说着，士隐已出前厅去了。</p>

<p>这里雨村且翻弄书籍解闷。忽听得窗外有女子嗽声，雨村遂起身往窗外一看，原来是一个丫鬟在那里掐花，生得仪容不俗，眉目清明，虽无十分姿色，却也有动人之处，雨村不觉看得呆了。那甄家丫鬟掐了花，方欲走时，猛抬头见窗内有人，敝巾旧服虽是贫窘，然生得腰宽背厚，面阔口方，更兼剑眉星眼，直鼻权腮。这丫鬟忙转身回避，心下乃想：“这人生得这样雄壮，却又这样褴缕，想他定是我家主人常说的什么贾雨村了，每有意帮助周济，只是无甚机会。我家并无这样贫窘亲友，想定是此人无疑了。怪道又说他必非久困之人。”如此想，不免又回头两次。雨村见他回头，便以为这女子心中有意于他，便狂喜不禁，自为此女子必是个巨眼英豪，风尘中之知己也。</p>

<p>一时小童进来，雨村打听得前面留饭，不可久待，遂从夹道中自便出门去了。士隐待客既散，知雨村自便，也不去再邀。</p>

<p>一日，早又中秋佳节，士隐家宴已毕，乃又另具一席于书房，却自己步月至庙中来邀雨村。</p>

<p>原来雨村自那日见了甄家之婢，曾回顾他两次，自为是个知己，便时刻放在心上。今又正值中秋，不免对月有怀，因而口占五言一律云：</p>

<p>未卜三生愿，频添一段愁。</p>

<p>闷来时敛额，行去几回头。</p>

<p>自顾风前影，谁堪月下俦。</p>

<p>蟾光如有意，先上玉人楼。</p>

<p>雨村吟罢，因又思及平生抱负苦未逢时，乃又搔首对天长叹，复高吟一联云：</p>

<p>玉在椟中求善价，钗于奁内待时飞。</p>

<p>恰值士隐走来听见，笑道：“雨村兄真抱负不浅也！”雨村忙笑道：“岂敢。不过偶吟前人之句，何敢狂诞至此。”因问“老先生何兴至此？”士隐笑道：“今夜中秋，俗谓团圆之节，想尊兄旅寄僧房，不无寂寥之感，故特具小酌，邀兄到敝斋一饮，不知可纳芹意[6]否？”雨村听了，并不推辞，便笑道：“既蒙谬爱，何敢拂此盛情。”说着，便同士隐过这边书院中来。</p>

<p>须臾茶毕，早已设下杯盘，那美酒佳肴自不必说。二人归坐，先是款斟慢饮，渐次谈至兴浓，不觉飞觥限斝起来。当时街坊上家家箫管，户户弦歌，当头一轮明月飞彩凝辉，二人愈添豪兴，酒到杯干。雨村此时已有七八分酒意，狂兴不禁，乃对月寓怀，口号一绝云：</p>

<p>时逢三五便团圆，满把晴光护玉栏。</p>

<p>天上一轮才捧出，人间万姓仰头看。</p>

<p>士隐听了，大叫妙哉，“吾每谓兄必非久居人下者，今所吟之句，飞腾之兆已见，不日可得接步履于云霓之上矣。可贺可贺。”乃亲斟一斗为贺。雨村因干过，叹道：“非晚生酒后狂言，若论时尚之学，晚生也或可去充数沽名，只是目今行囊路费一概无措，神京路远，非赖卖字撰文即能到者。”士隐不待说完，便道：“兄何不早言。愚每有此心，但每遇兄时，兄并未谈及，愚故未敢唐突。今既及此，愚虽不才，义利二字却还识得。且喜明岁正当大比，兄宜作速入都，春闱[7]一战，方不负兄之所学也。其盘费馀事弟自代为处置，亦不枉兄之谬识矣。”当下即命小童进去，速封五十两白银并两套冬衣。又云：“十九日乃黄道之期，兄可即买舟西上，待雄飞高举，明冬再晤，岂非大快之事耶！”雨村收了银衣，不过略谢一语，并不介意，仍是吃酒谈笑。那天已交三鼓，二人方散。</p>

<p>士隐送雨村去后，回房一觉，直至红日三竿方醒。因思昨夜之事，意欲再写两封荐书与雨村带至都中去，使雨村投谒个仕宦之家，为寄足之地。因使人过去请时，那家人去了回来说：“和尚说，贾爷今日五鼓已进京去了，也曾留下话与和尚转达老爷，说读书人不在黄道黑道[8]，总以事理为要，不及面辞了。”士隐听了，也只得罢了。</p>

<p>真是闲处光阴易过，倏忽又是元宵佳节矣。因士隐命家人霍启抱了英莲去看社火花灯，半夜中霍启因要小解，便将英莲放在一家门槛上坐着，待他小解完了来抱时，那有英莲的踪影。急得霍启直寻了半夜，至天明不见，那霍启也就不敢回来见主人，便逃往他乡去了。</p>

<p>那士隐夫妇见女儿一夜不归，便知有些不妥，再使几人去寻找，回来皆云连音响全无。夫妻二人半世只生此女，一旦失落，岂不思想，因此昼夜啼哭，几乎不曾寻死。看看的一月，士隐先就得了一病，当时封氏孺人也因思女构疾，日日请医调治。</p>

<p>不想这日三月十五，葫芦庙中炸供[9]，那些和尚不加小心，致使油锅火逸，便烧着窗纸。此方人家多用竹篱木壁，大抵也因劫数，于是接二连三，牵五挂四，将一条街烧得如火焰山一般。彼时虽有军民来救，那火已成了势，如何救得下，直烧了一夜方渐渐的熄去，也不知烧了几家。只可怜甄氏在隔壁，早已烧成一片瓦砾场了，只有他夫妇并几个家人的性命不曾伤了。急得士隐惟跌足长叹而已。只得与妻子商议，且到田庄上去安身。偏值近年水旱不收，鼠盗蜂起，无非抢田夺地，民不安生，因此官兵剿捕，难以安身。士隐只得将田庄都折变了，便携了妻子与两个丫鬟，投他岳丈家去。</p>

<p>他岳丈名唤封肃，本贯大如州人氏，虽是务农，家中都还殷实。今见女婿这等狼狈而来，心中便有些不乐。幸而士隐还有折变田产的银子未曾用完，拿出来托他随分就价置些房地，为后日衣食之计。那封肃便半哄半赚，些须与他些薄田朽屋。士隐乃读书之人，不惯生理稼穑等事，勉强支持了一二年，越觉穷了下去。封肃每见面时，便说些现成话；且人前人后，又怨他们不善过活，只一味好吃懒做等语。士隐知投人不着，心中未免悔恨；再兼上年惊吓，急忿怨痛，已有积伤：暮年之人贫病交攻，竟渐渐的露出那下世的光景来。可巧这日拄了拐，挣扎到街前散散心时，忽见那边来了一个跛足道人，疯狂落拓，麻屣鹑衣，口内念着几句言词道：</p>

<p>世人都晓神仙好，惟有功名忘不了，</p>

<p>古今将相在何方，荒塚一堆草没了。</p>

<p>世人都晓神仙好，只有金银忘不了，</p>

<p>终朝只恨聚无多，及至多时眼闭了。</p>

<p>世人都晓神仙好，只有娇妻忘不了，</p>

<p>君生日日说恩情，君死又随人去了。</p>

<p>世人都晓神仙好，只有儿孙忘不了，</p>

<p>痴心父母古来多，孝顺儿孙谁见了。</p>

<p>士隐听了，便迎上来道：“你满口说些什么？只听见些‘好了’‘好了’。”那道人笑道：“你若果听见‘好了’二字还算你明白。可知世上万般，‘好’便是‘了’，‘了’便是‘好’；若不‘了’，便不‘好’；若要‘好’，须是‘了’。我这歌儿便名‘好了歌’。”士隐本是有宿慧的，一闻此言，心中早已彻悟，因笑道：“且住，待我将你这‘好了歌’解注出来何如？”道人笑道：“你解，你解。”士隐乃说道：</p>

<p>陋室空堂，当年笏满床。衰草枯杨，曾为歌舞场。蛛丝儿结满雕梁，绿纱今又糊在蓬窗上。说甚么脂正浓，粉正香，如何两鬓又成霜。昨日黄土陇头送白骨，今宵红灯帐底卧鸳鸯。金满箱，银满箱，转眼乞丐人皆谤。正叹他人命不长，那知自己归来丧。训有方，保不定日后做强梁。择膏粱，谁承望流落在烟花巷。因嫌纱帽小，致使锁枷扛。昨怜破袄寒，今嫌紫蟒长。乱烘烘，你方唱罢我登场，反认他乡是故乡。甚荒唐。到头来，都是为他人作嫁衣裳。</p>

<p>那疯跛道人听了拍掌笑道：“解得切，解得切！”士隐便说一声：“走罢！”将道人肩上搭连[10]抢了过来背着，竟不回家，同了疯道人飘飘而去。当下烘动街坊众人，当作一件新闻传说。封氏闻得此信，哭个死去活来，只得与父亲商议，遣人各处访寻，那讨音信。无奈何，少不得依靠着他父母度日。幸而身边还有两个旧日的丫鬟伏侍，主仆三人日夜做些针线发卖，帮着父亲用度。那封肃虽然日日抱怨，也无可如何了。</p>

<p>这日甄家大丫头在门前买线，忽听街上喝道之声，众人都说新太爷到任。丫鬟隐在门内看时，只见军牢快手[11]一对一对的过去，俄而大轿内抬着一个乌纱猩袍的官府过去。丫鬟倒发了个怔，自忖这官好面善，倒像在那里见过的。于是进入房中，也就丢过不在心上。至晚间正待歇息之时，忽听一片声打的门响，许多人乱嚷，说本府太爷的差人来传人问话。封肃听了，吓得目瞪口呆。不知有何祸事，且听下回分解。</p>

<p><a href="#top">返回顶部</a></p>

<h2 id="section2">第二回 贾夫人仙逝扬州城 冷子兴演说荣国府</h2>

<p>诗云：一局输赢料不真，香销茶尽尚逡巡。</p>

<p>欲知目下兴衰兆，须问旁观冷眼人。</p>

<p>却说封肃因听见公差传唤，忙出来陪笑启问。那些人只嚷：“快请出甄爷来。”封肃忙陪笑道：“小人姓封，并不姓甄。只有当日小婿姓甄，今已出家一二年了，不知可是问他。”那些公人道：“我们也不知什么‘真’‘假’，因奉太爷之命来问你。他既是你女婿，便带了你去亲见太爷面禀，省得乱跑。”说着，不容封肃多言，大家推拥他去了。封家人各各惊慌，不知何兆。</p>

<p>那天约二更时，只见封肃方回来，欢天喜地。众人忙问端的，他乃说道：</p>

<p>“原来本府新升的太爷，姓贾名化，本湖州人氏，曾与女婿旧日相交。方才在咱们前过去，因看见娇杏那丫头买线，所以他只当女婿移住于此。我一一将原故回明，那太爷倒伤感叹息了一回。又问外孙女儿，我说看灯丢了。太爷说：‘不妨，我自使番役务必探访回来。’说了一回话，临走倒送了我二两银子。”甄家娘子听了，不免心中伤感。一宿无话。</p>

<p>至次日早有雨村遣人送了两封银子、四匹锦缎，答谢甄家娘子。又寄一封密书与封肃，托他向甄家娘子要那娇杏作二房。封肃喜的屁滚尿流，巴不得去奉承，便在女儿前一力撺掇[12]成了，乘夜只用一乘小轿，便把娇杏送进去了。雨村欢喜自不必说，乃封百金赠封肃，外又谢甄家娘子许多物事，令其好生养赡，以待寻访女儿下落。封肃回家无话。</p>

<p>却说娇杏这丫鬟，便是那年回顾雨村者，因偶然一顾，便弄出这段事来，亦是自己意料不到之奇缘。谁想他命运两济，不承望自到雨村身边，只一年便生了一子。又半载，雨村嫡妻忽染疾下世，雨村便将他扶侧作正室夫人了。正是：</p>

<p>偶因一着错，便为人上人。</p>

<p>原来雨村因那年士隐赠银之后，他于十六日便起身入都。至大比之期，不料他十分得意，已会了进士，选入外班，今已升了本府知府。虽才干优长，未免有贪酷之弊，且又恃才侮上，那些官员皆侧目而视。不上两年，便被上司寻了一个空隙，作成一本，参他“生性狡猾，擅纂礼仪，且沽清正之名，而暗结虎狼之属，致使地方多事，民命不堪”等语。龙颜大怒，即批革职。该部文书一到，本府官员无不喜悦。那雨村心中虽十分惭恨，却面上全无一点怨色，仍是嬉笑自若。交代过公事，将历年做官积的些资本并家小人属送至原籍安插妥协，却是自己担风袖月，游览天下胜迹。</p>

<p>那日偶又至维扬地面，因闻得今岁鹾政点的是林如海。这林如海姓林名海，表字如海，乃是前科的探花，今已升至兰台寺大夫。本贯姑苏人氏，今钦点出为巡盐御史，到任方一月有馀。原来这林如海之祖曾袭过列侯，今到如海已经五世。起初时只封袭三世，因当今隆恩盛德，远迈前代，额外加恩，至如海之父又袭了一代，至如海便从科第出身。虽系钟鼎之家，却亦是书香之族。只可惜这林家支庶不盛，子孙有限，虽有几门，却与如海俱是堂族而已，没甚亲支嫡派的。今如海年已四十，只有一个三岁之子，偏又于去岁死了。虽有几房姬妾，奈他命中无子，亦无可如何之事。今只有嫡妻贾氏生得一女，乳名黛玉，年方五岁。夫妻无子，故爱女如珍；且又见他聪明清秀，便也欲使他读书识几个字，不过假充养子之意，聊解膝下荒凉之叹。</p>

<p>雨村正值偶感风寒，病在旅店，将一月光景方渐愈。一因身体劳倦，二因盘费不继，也正欲寻个合式之处暂且歇下。幸有两个旧友亦在此境住居，因闻得鹾政欲聘一西宾[13]，雨村便相托友力，谋了进去，且作安身之计。妙在只一个女学生，并两个伴读丫鬟。这女学生年又小，身体又极怯弱，功课不限多寡，故十分省力。堪堪又是一载的光景，谁知女学生之母贾氏夫人一疾而终，女学生侍汤奉药，守丧尽哀，遂又将要辞馆别图。林如海意欲令女守制读书，故又将他留下。近因女学生哀痛过伤，本自怯弱多病的，触犯旧症，遂连日不曾上学。雨村闲居无聊，每当风日晴和，饭后便出来闲步。</p>

<p>这日偶至郭外，意欲赏鉴那村野风光。忽信步至一山环水旋，茂林深竹之处，隐隐有座庙宇，门巷倾颓，墙垣朽败，门前有额题着“智通寺”三字。门旁又有一副旧破的对联曰：</p>

<p>身后有馀忘缩手，眼前无路想回头。</p>

<p>雨村看了，因想道：“这两句话，文虽浅近，其意则深。也曾游过些名山大刹，倒不曾见过这话头。其中想必有个翻过筋斗来的[14]，也未可知，何不进去试试。”想着，走入看时，只有一个龙钟[15]老僧在那里煮粥。雨村见了，便不在意，及至问他两句话，那老僧既聋且昏，齿落舌钝，所答非所问。</p>

<p>雨村不耐烦，便仍出来，意欲到那村肆中沽饮三杯，以助野趣。于是款步行来，刚入肆门，只见座上吃酒之客有一人起身大笑，接了出来，口内说：“奇遇，奇遇。”雨村忙看时，此人是都中在古董行中贸易的号冷子兴者，旧日在都相识。雨村最赞这冷子兴是个有作为大本领的人，这子兴又借雨村斯文之名，故二人说话投机，最相契合。雨村忙亦笑问：“老兄何日到此，弟竟不知。今日偶遇，真奇缘也。”子兴道：“去年岁底到家。今因还要入都，从此顺路找个敝友说一句话，承他之情，留我多住两日，我也无甚紧事，且盘桓两日，待月半时也就起身了。今日敝友有事，我因闲步至此，且歇歇脚，不期这样巧遇。”一面说，一面让雨村同席坐了，另整上酒肴来。二人闲谈慢饮，叙些别后之事。</p>

<p>雨村因问：“近日都中可有新闻没有？”子兴道：“倒没有什么新闻，倒是老先生你贵同宗家出了一件小小的异事。”雨村笑道：“弟族中无人在都，何谈及此？”子兴笑道：“你们同姓，实非同宗一族。”雨村问是谁家。子兴道：“荣国府贾府中，可也不玷辱了先生的门楣了。”雨村笑道：“原来是他家。若论起来，寒族人丁却不少。自东汉贾复以来，支派繁盛，各省皆有，谁能逐细考查。若论荣国一支，却是同谱，但他那等荣耀，我们不便去攀扯，至今故越发生疏难认了。”子兴叹道：“老先生休如此说。如今的这宁荣两门也都萧索了，不比先时的光景。”雨村道：“当日宁荣两宅的人口也极多，如何就萧索了？”冷子兴道：“正是，说来也话长。”雨村道：“去岁我到金陵地界，因欲游览六朝遗迹，那日进了石头城，从他老宅门前经过。路北，东是宁国府，西是荣国府，二宅相连，竟将大半条街占了。大门前虽冷落无人，隔着围墙一望，里面厅殿楼阁，也还都峥嵘轩峻；就是后一带花园子里，树木山石，也还都有蓊蔚洇润之气，那里像个衰败之家！”子兴笑道：“亏你是进士出身，原来不通！古人有云：‘百足之虫，死而不僵。’[16]如今虽说不似先年那样兴盛，较之平常仕宦之家，到底气象不同。如今生齿日繁，事务日盛，主仆上下安富尊荣者尽多，运筹谋画者无一；其日用排场，又不能将就省俭。如今外面的架子虽未甚倒，内囊却也尽上来了。这还是小事，更有一件大事。谁知这钟鸣鼎食[17]之家，翰墨诗书之族，如今的儿孙竟一代不如一代了。”雨村听说也纳罕道：“这样诗礼之家，岂有不善教育之理。别门不知，只说这宁荣两宅，是最教子有方的。”</p>

<p>子兴叹道：“正说的是这两门呢。待我告诉你：当日宁国公与荣国公是一母同胞弟兄两个。宁公居长，生了四个儿子。宁公死后，长子贾代化袭了官，也养了两个儿子。长名贾敷，至八九岁上便死了。只剩了次子贾敬袭了官，如今一味好道，只爱烧丹炼汞，馀者一概不在心上。幸而早年留下一子，名唤贾珍，因他父亲一心想做神仙，把官倒让他袭了。他父亲又不肯回原籍来，只在都中城外和道士们胡羼。这位珍爷倒生了一个儿子，今年才十六岁，名叫贾蓉。如今敬老爹一概不管，这珍爷那里肯读书，只一味高乐不了，把宁国府竟翻了过来，也没有敢来管他的人。再说荣府你听，方才所说异事就出在这里。自荣公死后，长子贾代善袭了官，娶的也是金陵世勋史侯家的小姐为妻，生了两个儿子，长名贾赦，次名贾政。如今代善早已去世，太夫人尚在。长子贾赦袭着官。次子贾政自幼酷喜读书，祖父最疼，原欲以科甲出身的；不料代善临终时，遗本一上，皇上因恤先臣，即时令长子袭官外，问还有几子，立刻引见，遂额外赐了这政老爹一个主事之衔，令其入部习学。如今现已升了员外郎了。这政老爹的夫人王氏，头胎生得公子名唤贾珠，十四岁进学[18]，不到二十岁就娶了妻，生了一子，一病死了。第二胎生了一位小姐，生在大年初一日就奇了。不想次年又生了一位公子，说来更奇，一落胎胞，嘴里便衔下一块五彩晶莹的玉来，上面还有许多字迹，就取名叫作宝玉。你道是新奇异事不是？”</p>

<p>雨村笑道：“果然奇异。只怕这人来历不小。”子兴冷笑道：“万人皆如此说，因而乃祖母便先爱如珍宝。那年周岁时，政老爹便要试他将来的志向，便将那世上所有之物件摆了无数，与他抓取[19]，谁知他一概不取，伸手只把些脂粉钗环抓来。政老爹便大怒了，说将来酒色之徒耳，因此便大不喜悦。独那史老太君，还是命根一样。说来又奇，如今长了七八岁，虽然淘气异常，但其聪明乖觉处，百个不及他一个。说起孩子话来也奇怪，他说：‘女儿是水做的骨肉，男人是泥做的骨肉。我见了女儿，我便清爽；见了男子，便觉浊臭逼人。’你道好笑不好笑？将来色鬼无疑了。”雨村罕然厉色，忙止道：“非也。可惜你们不知道这人来历。大约政老前辈也错以淫魔色鬼看待了。若非多读书识事，加以致知格物之功、悟道参玄之力者，不能知也。”</p>

<p>子兴见他说得这样重大，忙请教其端。雨村道：“天地生人，除大仁大恶两种，余者皆无大异。若大仁者，则应运而生；大恶者，则应劫而生。运生世治，劫生世危。尧、舜、禹、汤、文、武、周、召、孔、孟、董、韩、周、程、张、朱，皆应运而生者。蚩尤、共工、桀、纣、始皇、王莽、曹操、桓温、安禄山、秦桧等，皆应劫而生者。大仁者，修治天下；大恶者，扰乱天下。清明灵秀，天地之正气，仁者之所秉也；残忍乖僻，天地之邪气，恶者之所秉也。今当运隆祚永之朝，太平无为之世，清明灵秀之气所秉者，上至朝廷，下至草野，比比皆是。所余之秀气漫无所归，遂为甘露，为和风，洽然溉及四海。彼残忍乖僻之邪气不能荡溢于光天化日之中，遂凝结充塞于深沟大壑之内，偶因风荡，或被云推，略有摇动感发之意，一丝半缕误而泄出者，偶值灵秀之气适过，正不容邪，邪复妒正，两不相下，亦如风水雷电地中既遇，既不能消，又不能让，必致搏击掀发后始尽。故其气亦必赋人，发泄一尽始散。使男女偶秉此气而生者，上则不能成仁人君子，下亦不能为大凶大恶。置之于万万人之中，其聪俊灵秀之气则在万万人之上；其乖僻邪谬不近人情之态，又在万万人之下。若生于富贵公侯之家，则为情痴情种；若生于诗书清贫之族，则为逸士高人；纵然偶生于薄祚寒门，断不能为走卒健仆，甘遭庸人驱制驾驭，必为奇优名娼。如前代之许由、陶潜、阮籍、嵇康、刘伶、王谢二族、顾虎头、陈后主、唐明皇、宋徽宗、刘庭芝、温飞卿、米南宫、石曼卿、柳耆卿、秦少游，近日之倪云林、唐伯虎、祝枝山，再如李龟年、黄幡绰、敬新磨、卓文君、红拂、薛涛、崔莺、朝云之流：此皆易地则同之人也。”</p>

<p>子兴道：“依你说，成则公侯，败则贼了。”雨村道：“正是这意。你还不知，我自革职以来，这两年遍游各省，也曾遇见两个异样孩子，所以方才你一说这宝玉，我就猜着了八九亦是这一派人物。不用远说，只金陵城内钦差金陵省体仁院总裁甄家，你可知道么？”子兴道：“谁人不知。这甄府和贾府就是老亲，又系世交，两家来往极其亲热的。便在下也和他家来往非止一日了。”</p>

<p>雨村笑道：“去岁我在金陵，曾有人荐我到甄府处馆。我进去看其光景，谁知他家那等显贵，却是个富而好礼之家，倒是个难得之馆。但这一个学生虽是启蒙，却比一个举业的还劳神。说起来更可笑，他说：‘必得两个女儿伴着我读书，我方能认得字，心里也明白；不然，我自己心里糊涂。’又常对跟他的小厮们道：‘这女儿两个字，极尊贵、极清净的，比那阿弥陀佛、元始天尊的这两个宝号，还更尊荣无对的呢。你们这浊口臭舌，万不可唐突了这两个字，要紧。但凡要说时，必须先用清水香茶漱了口才可。设若失错，便要凿牙穿腮等事。’其暴虐浮躁，顽劣憨痴，种种异常；只一放了学，进去见了那些女儿们，其温柔和平，聪敏文雅，竟又变了一个人了。因此他尊人也曾下死笞楚过几次，无奈竟不能改。每打的吃疼不过时，他便姐姐妹妹乱叫起来。后来听得里面女儿们拿他取笑：‘因何打急了只管叫姐妹作甚，莫不是求姐妹去说情讨饶，你岂不愧羞！’他回答的最妙，他说：‘急疼之时只叫姐姐妹妹字样，或可解疼也未可知，因叫了一声，便果觉不疼了，遂得了秘法，每疼痛之极，便连叫姐妹起来。’你说好笑不好笑？为他祖母溺爱不明，每因孙辱师责子，因此我就辞了馆出来。如今在巡盐御史林家坐馆了。你看这等子弟，必不能守祖父之根基，从师友之规谏的。只可惜他家几个好姊妹都是少有的。”</p>

<p>子兴道：“便是贾府中现在三个也不错。政老爹的长女名元春，现因贤孝才德，选入宫中作女史去了。二小姐乃赦老爹之妾所出，名迎春。三小姐乃政老爹之庶出，名探春。四小姐乃宁府珍爷之胞妹，名唤惜春。因史老夫人极爱孙女，都跟在祖母这边一处读书，听得个个不错。”雨村道：“更妙在甄家的风俗，女儿之名亦皆从男子之名命字，不似别家另外用那些‘春’‘红’‘香’‘玉’等艳字的。何得贾府亦落此俗套？”子兴道：“不然。只因现今大小姐是正月初一日所生，故名元春，余者方从了春字。上一辈的却也是从弟兄而来的。现有对证，目今你贵东家林公之夫人，即荣府中赦政二公之胞妹，在家时原名唤贾敏。不信时，你回去细访可知。”雨村拍案笑道：“怪道这女学生读至凡书中有‘敏’字，他皆念作‘密’字，每每如是；写的字遇着‘敏’字，又减一二笔，我心中就有些疑惑。今听你说，的是为此无疑矣。怪道我这女学生言语举止另是一样，不与近日女子相同。度其母必不凡，方得其女。今知为荣府之外孙，又不足罕矣。可伤其母上月竟亡故了。”子兴叹道：“老姊妹四个，这一个极小的又没了。长一辈的姊妹一个也没有了，只看这小一辈的将来之东床[20]如何呢。”</p>

<p>雨村道：“正是。方才说这政公已有了一个衔玉之儿，又有长子所遗一个弱孙，这赦老竟无一个不成？”子兴道：“政公既有玉儿之后，其妾又生了一个，倒不知其好歹。只眼前现有二子一孙，却不知将来如何。若问那赦公，也有二子，长名贾琏，今已二十来往了。亲上作亲，娶的就是政老爹夫人王氏之内侄女，今已娶了二年。这位琏爷身上，现捐的是个同知，也是不喜读书，于世路上好机变言谈去得，所以如今只在乃叔政老爹家住着，帮着料理些家务。谁知自娶了他令夫人之后，倒上下无一人不称颂他夫人的，琏爷倒退了一射之地。说模样又极标致，言谈又极爽利，心机又极深细，竟是个男人万不及一的。”雨村听了笑道：“可知我前言不谬。你我方才所说这几个人，都只怕是那正邪两赋而来一路之人，未可知也。”子兴道：“邪也罢，正也罢，只顾算别人家的帐，你也吃一杯酒才好。”雨村道：“正是只顾说话，竟多吃了几杯。”子兴笑道：“说着别人家的闲话，正好下酒，即多吃几杯何妨。”雨村向窗外看道：“天也晚了，仔细关了城门。我们慢慢进城再谈，未为不可。”于是二人起身算还酒帐。</p>

<p>方欲走时，只听得后面有人叫道：“雨村兄，恭喜了。来这等村野地方何干？”雨村忙回头看时……要知是谁，且听下回分解。</p>
