<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
* {box-sizing: border-box;}

.img-comp-container {
  position: relative;
  height: 200px; /*should be the same height as the images*/
}

.img-comp-img {
  position: absolute;
  width: auto;
  height: auto;
  overflow:hidden;
}

.img-comp-img img {
  display:block;
  vertical-align:middle;
}

.img-comp-slider {
  position: absolute;
  z-index:9;
  cursor: ew-resize;
  /*set the appearance of the slider:*/
  width: 40px;
  height: 40px;
  background-color: #2196F3;
  opacity: 0.7;
  border-radius: 50%;
}
</style>
<script>
function initComparisons() {
  var x, i;
  /* 查找具有 "overlay" 类的所有元素： */
  x = document.getElementsByClassName("img-comp-overlay");
  for (i = 0; i < x.length; i++) {
    /* 
	对于每个“覆盖”元素执行一次：
    执行compareImages函数时，将“覆盖”元素作为参数传递：
	*/
    compareImages(x[i]);
  }
  function compareImages(img) {
    var slider, img, clicked = 0, w, h;
    /* 获取 img 元素的宽度和高度 */
    w = img.offsetWidth;
    h = img.offsetHeight;
    /* 将 img 元素的宽度设置为 50%： */
    img.style.width = (w / 2) + "px";
    /* 创建滑块： */
    slider = document.createElement("DIV");
    slider.setAttribute("class", "img-comp-slider");
    /* 插入滑块 */
    img.parentElement.insertBefore(slider, img);
    /* 将滑块置于中间： */
    slider.style.top = (h / 2) - (slider.offsetHeight / 2) + "px";
    slider.style.left = (w / 2) - (slider.offsetWidth / 2) + "px";
    /* 按下鼠标按钮时执行的函数： */
    slider.addEventListener("mousedown", slideReady);
    /* 释放鼠标按钮时执行的另一个函数： */
    window.addEventListener("mouseup", slideFinish);
    /* 或者触摸（对于触摸屏：） */
    slider.addEventListener("touchstart", slideReady);
     /* 并且释放（对于触摸屏：） */
    window.addEventListener("touchend", slideFinish);
    function slideReady(e) {
      /* 防止在图像上移动时可能发生的任何其他操作： */
      e.preventDefault();
      /* 滑块现已被点击并准备移动： */
      clicked = 1;
      /* 当滑块移动时执行的函数： */
      window.addEventListener("mousemove", slideMove);
      window.addEventListener("touchmove", slideMove);
    }
    function slideFinish() {
      /* 不再单击滑块： */
      clicked = 0;
    }
    function slideMove(e) {
      var pos;
      /* 如果不再点击滑块，则退出此函数： */
      if (clicked == 0) return false;
      /* 获取光标的 x 位置： */
      pos = getCursorPos(e)
      /* 防止滑块位于图像之外： */
      if (pos < 0) pos = 0;
      if (pos > w) pos = w;
      /* 执行一个函数，根据光标调整覆盖图像的大小： */
      slide(pos);
    }
    function getCursorPos(e) {
      var a, x = 0;
      e = (e.changedTouches) ? e.changedTouches[0] : e;
      /* 获取图像的 x 位置： */
      a = img.getBoundingClientRect();
      /* 计算光标相对于图像的 x 坐标： */
      x = e.pageX - a.left;
      /* 考虑任何页面滚动： */
      x = x - window.pageXOffset;
      return x;
    }
    function slide(x) {
      /* 调整图像大小： */
      img.style.width = x + "px";
      /* 定位滑块： */
      slider.style.left = img.offsetWidth - (slider.offsetWidth / 2) + "px";
    }
  }
}
</script>
</head>
<body>

<h1>比较两张图片</h1>

<p>拖动蓝色滑块可比较两张图片：</p>

<div class="img-comp-container">
  <div class="img-comp-img">
    <img src="../i/photo/beijing-2.jpg" width="600">
  </div>
  <div class="img-comp-img img-comp-overlay">
    <img src="../i/photo/beijing-3.jpg" width="600">
  </div>
</div>

<script>
/* 执行一个函数，该函数将为每个具有 img-comp-overlay 类的元素执行图像比较功能。 */
initComparisons();
</script>

<script>
var currentStack=true;
if ((window.screen.availWidth <= 768 && window.innerHeight > window.innerWidth) || "" == " horizontal") {restack(true);}
function restack(vertical) {
    var tc, ic, t, i, c, n, f, sv, sh, d, height, flt, width;
    tc = document.getElementById("textareacontainer");
    ic = document.getElementById("iframecontainer");
    t = document.getElementById("textarea");
    i = document.getElementById("iframe");
    c = document.getElementById("container");
    n = document.getElementById("navfirst");
    //sv = document.getElementById("stackV");
    //sh = document.getElementById("stackH");
    tc.className = tc.className.replace("horizontal", "");
    ic.className = ic.className.replace("horizontal", "");
    t.className = t.className.replace("horizontal", "");
    i.className = i.className.replace("horizontal", "");
    c.className = c.className.replace("horizontal", "");
    n.className = n.className.replace("horizontal", "");
    //if (sv) {sv.className = sv.className.replace("horizontal", "")};
    //if (sv) {sh.className = sh.className.replace("horizontal", "")};
    //stack = "";
    if (vertical) {
        tc.className = tc.className + " horizontal";
        ic.className = ic.className + " horizontal";        
        t.className = t.className + " horizontal";        
        i.className = i.className + " horizontal";
        c.className = c.className + " horizontal";
        n.className = n.className + " horizontal";
        //if (sv) {sv.className = sv.className + " horizontal"};
        //if (sv) {sh.className = sh.className + " horizontal"};
        //stack = " horizontal";
        document.getElementById("textareacontainer").style.height = "50%";
        document.getElementById("iframecontainer").style.height = "50%";
        document.getElementById("textareacontainer").style.width = "100%";
        document.getElementById("iframecontainer").style.width = "100%";
        currentStack=false;
    } else {
        document.getElementById("textareacontainer").style.height = "100%";
        document.getElementById("iframecontainer").style.height = "100%";
        document.getElementById("textareacontainer").style.width = "50%";
        document.getElementById("iframecontainer").style.width = "50%";
        currentStack=true;        
    }
}
</script>


<script>
function retheme() {
  var cc = document.body.className;
  if (cc.indexOf("darktheme") > -1) {
    document.body.className = cc.replace("darktheme", "");
  } else {
    document.body.className += " darktheme";
  }
}
</script>
