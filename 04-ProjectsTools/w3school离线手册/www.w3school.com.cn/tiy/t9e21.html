<!DOCTYPE html>

<style>
* {box-sizing: border-box}
body {font-family: Verdana, sans-serif; margin:0}

/* 幻灯片容器 */
.slideshow-container {
  position: relative;
  background: #f1f1f1f1;
}

/* 幻灯片 */
.mySlides {
  display: none;
  padding: 80px;
  text-align: center;
}

/* 下一个 & 上一个按钮 */
.prev, .next {
  cursor: pointer;
  position: absolute;
  top: 50%;
  width: auto;
  margin-top: -30px;
  padding: 16px;
  color: #888;
  font-weight: bold;
  font-size: 20px;
  border-radius: 0 3px 3px 0;
  user-select: none;
}

/* 将“下一个按钮”定位到右边 */
.next {
  position: absolute;
  right: 0;
  border-radius: 3px 0 0 3px;
}

/* 鼠标悬停时，添加带有一点透明的黑色背景色 */
.prev:hover, .next:hover {
  background-color: rgba(0,0,0,0.8);
  color: white;
}

/* 点/项目符号/指示器容器 */
.dot-container {
  text-align: center;
  padding: 20px;
  background: #ddd;
}

/* 点/项目符号/指示器 */
.dot {
  cursor: pointer;
  height: 15px;
  width: 15px;
  margin: 0 2px;
  background-color: #bbb;
  border-radius: 50%;
  display: inline-block;
  transition: background-color 0.6s ease;
}

/* 为活动的点/圆添加背景颜色 */
.active, .dot:hover {
  background-color: #717171;
}

/* 为所有引用添加斜体字样式 */
q {font-style: italic;}

/* 为作者添加蓝色 */
.author {color: cornflowerblue;}
</style>
</head>
<body>

<div class="slideshow-container">

<div class="mySlides">
  <q>一切反动派都是纸老虎！</q>
  <p class="author">- 毛泽东</p>
</div>

<div class="mySlides">
  <q>改革是中国发展生产力的必由之路。</q>
  <p class="author">- 邓小平</p>
</div>

<div class="mySlides">
  <q>中国共产党人的初心和使命，就是为中国人民谋幸福，为中华民族谋复兴。</q>
  <p class="author">- 习近平</p>
</div>

<a class="prev" onclick="plusSlides(-1)">❮</a>
<a class="next" onclick="plusSlides(1)">❯</a>

</div>

<div class="dot-container">
  <span class="dot" onclick="currentSlide(1)"></span> 
  <span class="dot" onclick="currentSlide(2)"></span> 
  <span class="dot" onclick="currentSlide(3)"></span> 
</div>

<script>
var slideIndex = 1;
showSlides(slideIndex);

function plusSlides(n) {
  showSlides(slideIndex += n);
}

function currentSlide(n) {
  showSlides(slideIndex = n);
}

function showSlides(n) {
  var i;
  var slides = document.getElementsByClassName("mySlides");
  var dots = document.getElementsByClassName("dot");
  if (n > slides.length) {slideIndex = 1}    
  if (n < 1) {slideIndex = slides.length}
  for (i = 0; i < slides.length; i++) {
      slides[i].style.display = "none";  
  }
  for (i = 0; i < dots.length; i++) {
      dots[i].className = dots[i].className.replace(" active", "");
  }
  slides[slideIndex-1].style.display = "block";  
  dots[slideIndex-1].className += " active";
}
</script>

</body>

  var ua = navigator.userAgent;

  if (ua && ua.toUpperCase().indexOf("OPERA MINI") > -1) { return false; }
  window.editor = CodeMirror.fromTextArea(document.getElementById("textareaCode"), {
    mode: 'text/html',
    htmlMode: true,
    lineWrapping: true,
    smartIndent: false,
    addModeClass: true
  });
//  window.editor.on("change", function () {window.editor.save();});
}
colorcoding();
</script>


<script>
var currentStack=true;
if ((window.screen.availWidth <= 768 && window.innerHeight > window.innerWidth) || "" == " horizontal") {restack(true);}
function restack(vertical) {
    var tc, ic, t, i, c, n, f, sv, sh, d, height, flt, width;
    tc = document.getElementById("textareacontainer");
    ic = document.getElementById("iframecontainer");
    t = document.getElementById("textarea");
    i = document.getElementById("iframe");
    c = document.getElementById("container");
    n = document.getElementById("navfirst");
    //sv = document.getElementById("stackV");
    //sh = document.getElementById("stackH");
    tc.className = tc.className.replace("horizontal", "");
    ic.className = ic.className.replace("horizontal", "");
    t.className = t.className.replace("horizontal", "");
    i.className = i.className.replace("horizontal", "");
    c.className = c.className.replace("horizontal", "");
    n.className = n.className.replace("horizontal", "");
    //if (sv) {sv.className = sv.className.replace("horizontal", "")};
    //if (sv) {sh.className = sh.className.replace("horizontal", "")};
    //stack = "";
    if (vertical) {
        tc.className = tc.className + " horizontal";
        ic.className = ic.className + " horizontal";        
        t.className = t.className + " horizontal";        
        i.className = i.className + " horizontal";
        c.className = c.className + " horizontal";
        n.className = n.className + " horizontal";
        //if (sv) {sv.className = sv.className + " horizontal"};
        //if (sv) {sh.className = sh.className + " horizontal"};
        //stack = " horizontal";
        document.getElementById("textareacontainer").style.height = "50%";
        document.getElementById("iframecontainer").style.height = "50%";
        document.getElementById("textareacontainer").style.width = "100%";
        document.getElementById("iframecontainer").style.width = "100%";
        currentStack=false;
    } else {
        document.getElementById("textareacontainer").style.height = "100%";
        document.getElementById("iframecontainer").style.height = "100%";
        document.getElementById("textareacontainer").style.width = "50%";
        document.getElementById("iframecontainer").style.width = "50%";
        currentStack=true;        
    }
}
</script>


<script>
function retheme() {
  var cc = document.body.className;
  if (cc.indexOf("darktheme") > -1) {
    document.body.className = cc.replace("darktheme", "");
  } else {
    document.body.className += " darktheme";
  }
}
</script>
