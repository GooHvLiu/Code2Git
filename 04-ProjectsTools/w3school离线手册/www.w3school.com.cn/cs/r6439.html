<head>
<meta charset="utf-8">
<title>Python Result</title>

<style>
* {
    margin: 0;
    padding: 0;
}

body {
    background: #000000;
    color: #ffffff;
    line-height: 1.5;
    font-family: consolas,"courier new",monospace;
}

pre#python_result {
    padding: 8px;
	font-size:15px;
}
</style>
</head>

<body>
<pre id="python_result">
Enter your age:
<input type="text" value id="usrage" style="border:none;background-color:black;color:white;outline:none" autofocus autocomplete="off">
<span id="myuserName"></span>

<script>
var myInput = document.getElementById("usrage");
var myOutput = document.getElementById("myuserName");

myInput.addEventListener("keyup", function(event) {
  event.preventDefault();
  if (event.keyCode === 13) {
    myOutput.innerHTML = "Your age is: " + myInput.value;
    myInput.disabled = true;
    if (isNaN(myInput.value) || (myInput.value == "")) {
      myOutput.innerHTML = "System.FormatException: 'Input string was not in a correct format.'";
    }
  }
});</script>
</pre>
</body>
