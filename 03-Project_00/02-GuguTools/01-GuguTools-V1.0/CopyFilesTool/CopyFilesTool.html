<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>批量拷贝工具</title>
    <link rel="icon" href="../Images/CopyFiles_icon.png">
    <link rel="stylesheet" href="../Styles/G-Tool_header.css">
    <link rel="stylesheet" href="../Styles/copy_files_tool.css">
    <script src="../Sources/loading_dialog.js"></script>
    <script src="../Sources/login_dialog.js"></script>
</head>
<body>
    <header class="header" style="visibility: hidden;">
        <div class="logo">
            <img src="../Images/G-Tool_icon.png" alt="工具箱图标">
            <span>咕咕工具箱/批量拷贝工具</span>
        </div>
        <div class="debug-mode-toggle">
            <button id="debugModeButton" class="debug-mode-button" title="切换调试模式">
                <svg class="debug-icon" viewBox="0 0 24 24" width="16" height="16">
                    <path d="M20 8h-2.81c-.45-1.29-1.26-2.43-2.39-3.27L16 3l-1.71 1.71C13.08 4.25 11.76 4 10.5 4C9.24 4 7.92 4.25 6.71 4.71L5 3 6.2 4.73C5.07 5.57 4.26 6.71 3.81 8H1v2h2.09c-.05.33-.09.66-.09 1v1H1v2h2v1c0 .34.04.67.09 1H1v2h2.81c1.04 3.17 4.03 5 7.19 5s6.15-1.83 7.19-5H20v-2h-2.09c.05-.33.09-.66.09-1v-1h2v-2h-2v-1c0-.34-.04-.67-.09-1H20V8zm-4 4v-1h-2V9h-2v2h-2V9H8v2H6v1H4v2h2v1h2v2h2v-2h2v2h2v-2h2v-1h2v-2h-2z"/>
                </svg>
                <span class="debug-text">运行模式</span>
            </button>
        </div>
    </header>
    <div class="main-container" style="visibility: hidden;">
        <div class="content-area">
            <div class="button-group">
                <button id="sourceButton">源文件夹</button>
                <button id="targetButton" style="background-color: #cccccc;" disabled>目标文件夹</button>
                <button id="fileListButton" style="background-color: #cccccc;" disabled>拷贝清单</button>
                <button id="startCopyButton" style="background-color: #cccccc;" disabled>开始拷贝</button>
            </div>
            <div id="status">
                <div class="status-info"></div>
                <div class="progress-container">
                    <div class="progress-bar"></div>
                </div>
            </div>
            <div class="log-container" id="logContainer"></div>
        </div>
        <div class="debug-log-container">
            <h3 id="debugLogTitle">调试日志</h3>
            <div id="debugLog" class="debug-log"></div>
        </div>
    </div>

    <script>
        // 定义登录验证常量
        const LOGIN_USERNAME = 'admin';
        const LOGIN_PASSWORD = 'copy';

        // 检查浏览器兼容性
        if (typeof Promise === 'undefined' || !window.showDirectoryPicker) {
            alert('您的浏览器不支持必要的现代Web功能，请使用最新版本的Chrome、Edge或Firefox浏览器。');
        }

        // 检查URL参数是否包含有效的验证标识
        function isFromToolbox() {
            try {
                const urlParams = new URLSearchParams(window.location.search);
                const authToken = urlParams.get('auth');
                return authToken === 'gugu2024';
            } catch (e) {
                console.error('检查验证参数失败:', e);
                return false;
            }
        }

        // 设置验证函数
        window.validateLogin = async function(username, password) {
            // 验证用户名和密码
            return username === LOGIN_USERNAME && password === LOGIN_PASSWORD;
        };

        // 页面加载完成后检查来源并决定是否显示登录窗口
        document.addEventListener('DOMContentLoaded', function() {
            // 检查sessionStorage中的登录状态
            const isLoggedIn = sessionStorage.getItem('isLoggedIn');
            
            // 检查是否从工具箱页面跳转而来
            const fromToolbox = isFromToolbox();
            
            // 如果是从工具箱页面跳转而来，直接显示主界面；如果不是，则需要检查登录状态
            if (fromToolbox || isLoggedIn) {
                document.querySelector('.main-container').style.visibility = 'visible';
                document.querySelector('.header').style.visibility = 'visible';
            } else {
                // 首次打开页面，隐藏主界面内容和header
                document.querySelector('.main-container').style.visibility = 'hidden';
                document.querySelector('.header').style.visibility = 'hidden';
                // 显示登录窗口
                showLoginDialog();
            }
        });

        // 添加登录成功事件监听
        document.addEventListener('loginSuccess', function() {
            // 设置登录状态
            sessionStorage.setItem('isLoggedIn', 'true');
            // 显示主界面内容和header
            document.querySelector('.main-container').style.visibility = 'visible';
            document.querySelector('.header').style.visibility = 'visible';
        });

        // 添加调试模式按钮点击事件
        document.getElementById('debugModeButton').addEventListener('click', function() {
            const debugText = this.querySelector('.debug-text');
            const debugLogContainer = document.querySelector('.debug-log-container');
            
            if (debugText.textContent === '运行模式') {
                // 显示登录弹窗，并标记这是从调试按钮触发的
                window.loginDialogParams = { fromDebugButton: true };
                showLoginDialog();
            } else {
                debugText.textContent = '运行模式';
                this.classList.remove('engineering-mode');
                debugLogContainer.style.visibility = 'hidden';
            }
        });

        // 添加登录成功事件监听
        document.addEventListener('loginSuccess', function(event) {
            // 显示主界面内容和header
            document.querySelector('.main-container').style.visibility = 'visible';
            document.querySelector('.header').style.visibility = 'visible';

            // 只有在点击运行模式按钮后的登录才切换到工程模式
            if (event.detail && event.detail.fromDebugButton) {
                const debugModeButton = document.getElementById('debugModeButton');
                const debugText = debugModeButton.querySelector('.debug-text');
                const debugLogContainer = document.querySelector('.debug-log-container');
                
                debugText.textContent = '工程模式';
                debugModeButton.classList.add('engineering-mode');
                debugLogContainer.style.visibility = 'visible';
            }
        });
        let sourceDir = null;
        let targetDir = null;
        let fileList = null;

        // 初始化按钮状态
        function initializeButtonStates() {
            document.getElementById('targetButton').disabled = true;
            document.getElementById('fileListButton').disabled = true;
            document.getElementById('startCopyButton').disabled = true;
        }

        // 更新按钮状态
        function updateButtonStates() {
            const targetButton = document.getElementById('targetButton');
            const fileListButton = document.getElementById('fileListButton');
            const startButton = document.getElementById('startCopyButton');

            // 源文件夹选择后，目标文件夹按钮可用
            targetButton.disabled = !sourceDir;
            // 源文件夹和目标文件夹都选择后，清单按钮可用
            fileListButton.disabled = !(sourceDir && targetDir);
            // 所有条件满足后，开始拷贝按钮可用
            startButton.disabled = !(sourceDir && targetDir && fileList);

            // 更新按钮样式
            [targetButton, fileListButton, startButton].forEach(button => {
                if (button.disabled) {
                    button.style.backgroundColor = '#cccccc';
                    button.style.cursor = 'not-allowed';
                } else {
                    button.style.backgroundColor = '#4CAF50';
                    button.style.cursor = 'pointer';
                }
            });
        }

        // 初始化按钮状态
        initializeButtonStates();

        // 初始化状态信息
        updateStatusInfo();

        // 添加日志条目
        function addLogEntry(message, type = 'success') {
            const logContainer = document.getElementById('logContainer');
            const logEntry = document.createElement('div');
            logEntry.className = `log-entry log-${type}`;
            logEntry.textContent = message;
            logContainer.appendChild(logEntry);
            logContainer.scrollTop = logContainer.scrollHeight;
        }

        // 清空日志
        function clearLog() {
            const logContainer = document.getElementById('logContainer');
            logContainer.innerHTML = '';
            // 添加欢迎信息
            addLogEntry('Ready，开始吧～', 'success');
        }

        // 页面加载完成时显示欢迎信息
        clearLog();

        // 源文件夹选择
        document.getElementById('sourceButton').addEventListener('click', async () => {
            // 重置所有状态
            sourceDir = null;
            targetDir = null;
            fileList = null;
            
            // 重置按钮颜色
            document.getElementById('sourceButton').style.backgroundColor = '#4CAF50';
            document.getElementById('targetButton').style.backgroundColor = '#4CAF50';
            document.getElementById('fileListButton').style.backgroundColor = '#4CAF50';
            
            // 清空日志
            clearLog();
            
            // 重置进度条和状态信息
            const progressBar = document.querySelector('.progress-bar');
            progressBar.style.width = '0%';
            document.querySelector('.status-info').textContent = '从选择[源文件夹]开始吧';
            
            // 重置调试日志
            const debugLog = document.getElementById('debugLog');
            debugLog.innerHTML = '';
            document.getElementById('debugLogTitle').textContent = '调试日志';
            
            // 更新按钮状态
            updateButtonStates();
            
            // 选择新的源文件夹
            sourceDir = await window.showDirectoryPicker({
                mode: 'read'
            }).catch(err => {
                console.error('选择源目录失败:', err);
                addLogEntry('选择源目录失败: ' + err.message, 'error');
                return null;
            });
            
            if (sourceDir) {
                document.getElementById('sourceButton').style.backgroundColor = '#45a049';
                addLogEntry(`已选择源文件夹: ${sourceDir.name}`);
                // 在debug log窗口中追加显示选中的文件夹名称
                const debugLog = document.querySelector('.debug-log');
                const logEntry = document.createElement('div');
                logEntry.textContent = `已选择源文件夹: ${sourceDir.name}`;
                debugLog.appendChild(logEntry);
                updateStatusInfo();
                updateButtonStates();
            }
        });

        // 目标文件夹选择
        document.getElementById('targetButton').addEventListener('click', async () => {
            targetDir = await window.showDirectoryPicker({
                mode: 'readwrite'
            }).catch(err => {
                console.error('选择目标目录失败:', err);
                addLogEntry('选择目标目录失败: ' + err.message, 'error');
                return null;
            });
            if (targetDir) {
                document.getElementById('targetButton').style.backgroundColor = '#45a049';
                addLogEntry(`已选择目标文件夹: ${targetDir.name}`);
                updateStatusInfo();
                updateButtonStates();
            }
        });

        // 文件清单选择
        document.getElementById('fileListButton').addEventListener('click', async () => {
            const [fileHandle] = await window.showOpenFilePicker({
                excludeAcceptAllOption: true,
                types: [{
                    description: '文本文件',
                    accept: {'text/plain': ['.txt']}
                }]
            }).catch(err => {
                console.error('选择文件清单失败:', err);
                addLogEntry('选择文件清单失败: ' + err.message, 'error');
                return [null];
            });
            if (fileHandle) {
                const file = await fileHandle.getFile();
                const content = await file.text();
                fileList = content.split('\n').filter(name => name.trim());
                document.getElementById('fileListButton').style.backgroundColor = '#45a049';
                addLogEntry(`已选择拷贝清单，共 ${fileList.length} 个文件`);
                updateStatusInfo();
                updateButtonStates();
            }
        });

        // 更新状态信息显示
        async function updateStatusInfo(copyProgress = null) {
            const statusInfo = document.querySelector('.status-info');
            const progressBar = document.querySelector('.progress-bar');
            let progress = 0;
            let stepText = '从选择[源文件夹]开始吧';
            
            try {
                if (copyProgress !== null) {
                    // 在拷贝过程中显示实时进度
                    progress = copyProgress;
                    stepText = `4/4 正拷贝文件... ${progress.toFixed(1)}%`;
                } else {
                    // 初始化阶段的进度显示
                    if (sourceDir) {
                        progress = 25;
                        const sourcePath = await sourceDir.name;
                        stepText = `1/4 已选择源文件夹: ${sourcePath}`;
                    }
                    if (targetDir) {
                        progress = 50;
                        const targetPath = await targetDir.name;
                        stepText = `2/4 已选择目标文件夹: ${targetPath}`;
                    }
                    if (fileList) {
                        progress = 75;
                        stepText = `3/4 已选择拷贝清单: ${fileList.length} 个文件`;
                    }
                }
                
                statusInfo.textContent = stepText;
                progressBar.style.width = `${progress}%`;
            } catch (err) {
                console.error('更新状态信息失败:', err);
                statusInfo.textContent = '更新状态信息失败';
            }
        }

        // 更新调试日志标题
        function updateDebugLogTitle(completedCount, totalCount) {
            const percentage = ((completedCount / totalCount) * 100).toFixed(1);
            const debugLogTitle = document.getElementById('debugLogTitle');
            debugLogTitle.textContent = `调试日志 - 已处理：${percentage}%（${completedCount}/${totalCount}）`;
        }

        // 开始拷贝文件
        document.getElementById('startCopyButton').addEventListener('click', async () => {
            if (!sourceDir || !targetDir || !fileList) {
                return;
            }

            // 显示加载弹窗
            showLoadingDialog();

            // 禁用所有按钮
            const buttons = ['sourceButton', 'targetButton', 'fileListButton', 'startCopyButton'];
            buttons.forEach(id => {
                document.getElementById(id).disabled = true;
                document.getElementById(id).style.backgroundColor = '#cccccc';
                document.getElementById(id).style.cursor = 'not-allowed';
            });

            // 初始化状态显示
            const statusDiv = document.getElementById('status');
            const statusInfo = statusDiv.querySelector('.status-info');
            const progressBar = statusDiv.querySelector('.progress-bar');
            const logContainer = document.getElementById('logContainer');
            
            // 重置进度条和状态信息
            statusInfo.textContent = '4/4 准备开始拷贝文件...';
            progressBar.style.width = '0%';
            
            const totalFiles = fileList.length;
            let completedFiles = 0;
            let successFiles = 0;
            let totalBytes = 0;
            let processedBytes = 0;
            const fileStatus = new Map();

            // 更新进度的函数
            const updateProgress = () => {
                const progress = (completedFiles / totalFiles) * 100;
                progressBar.style.width = `${progress.toFixed(1)}%`;
                statusInfo.textContent = `4/4 正在拷贝文件... ${progress.toFixed(1)}%`;
            };

            try {
                // 创建Map来存储文件处理状态
                fileList.forEach((fileName, index) => {
                    fileStatus.set(fileName.trim(), {
                        index,
                        status: 'pending',
                        message: ''
                    });
                });

                // 创建一个数组来存储所有的拷贝操作Promise
                const copyPromises = fileList.map(async (fileName, index) => {
                    const trimmedFileName = fileName.trim();
                    try {
                        // 获取源文件
                        const sourceFile = await sourceDir.getFileHandle(trimmedFileName);
                        const file = await sourceFile.getFile();
                        
                        // 创建目标文件
                        const targetFile = await targetDir.getFileHandle(trimmedFileName, { create: true });
                        const writable = await targetFile.createWritable();

                        // 获取文件大小
                        const fileSize = file.size;
                        const chunkSize = 8 * 1024 * 1024; // 8MB chunks
                        let bytesWritten = 0;

                        // 使用更高效的ArrayBuffer进行文件读写
                        const reader = new FileReader();
                        const readChunk = async (start, end) => {
                            return new Promise((resolve, reject) => {
                                const blob = file.slice(start, end);
                                reader.onload = () => resolve(reader.result);
                                reader.onerror = reject;
                                reader.readAsArrayBuffer(blob);
                            });
                        };

                        // 分块读取和写入文件
                        for (let start = 0; start < fileSize; start += chunkSize) {
                            const end = Math.min(start + chunkSize, fileSize);
                            const chunk = await readChunk(start, end);
                            await writable.write(chunk);
                            bytesWritten += (end - start);
                            processedBytes += (end - start);
                            
                            // 实时更新进度条
                            updateProgress();
                        }

                        await writable.close();                        
                        // 更新进度
                        completedFiles++;
                        successFiles++;
                        updateProgress();
                        // 更新文件状态
                        fileStatus.set(trimmedFileName, {
                            index,
                            status: 'success',
                            message: `✅ 成功拷贝文件: ${trimmedFileName}`
                        });
                        // 添加到调试日志
                        const debugLog = document.getElementById('debugLog');
                        debugLog.innerHTML += `<div style="color: #4CAF50">✅ ${trimmedFileName}</div>`;
                        updateDebugLogTitle(completedFiles, totalFiles);

                    } catch (err) {
                        console.error(`拷贝文件失败: ${trimmedFileName}`, err);
                        fileStatus.set(trimmedFileName, {
                            index,
                            status: 'error',
                            message: `❌ 拷贝失败: ${trimmedFileName} - ${err.message}`
                        });
                        // 添加到调试日志
                        const debugLog = document.getElementById('debugLog');
                        debugLog.innerHTML += `<div style="color: #f44336">❌ ${trimmedFileName} - ${err.message}</div>`;
                        // 更新完成数量和调试日志标题
                        completedFiles++;
                        updateDebugLogTitle(completedFiles, totalFiles);
                    }
                });

                // 等待所有拷贝操作完成
                await Promise.all(copyPromises);

                // 按照原始清单顺序输出日志
                fileList.forEach(fileName => {
                    const status = fileStatus.get(fileName.trim());
                    if (status) {
                        addLogEntry(status.message, status.status === 'success' ? 'success' : 'error');
                    }
                });

                // 最终更新
                progressBar.style.width = '100%';
                statusInfo.textContent = `4/4 拷贝完成! 共处理${totalFiles}个文件，成功${successFiles}个`;

            } catch (err) {
                console.error('拷贝过程出错:', err);
                statusInfo.textContent = '拷贝过程出错';
                addLogEntry(`拷贝过程出错: ${err.message}`, 'error');
            } finally {
                // 隐藏加载弹窗
                hideLoadingDialog();
                // 恢复按钮状态
                buttons.forEach(id => {
                    const button = document.getElementById(id);
                    button.disabled = false;
                    button.style.backgroundColor = '#4CAF50';
                    button.style.cursor = 'pointer';
                });
                updateButtonStates();
            }
        });
    </script>
</body>
</html>
