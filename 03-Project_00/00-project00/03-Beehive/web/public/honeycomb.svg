<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="honeyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFB347;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FF8C00;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="honeyGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFA500;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- 蜂巢六边形组合 -->
  <!-- 中心六边形 -->
  <polygon points="32,14 44,21 44,35 32,42 20,35 20,21" fill="url(#honeyGrad)" stroke="#E67E22" stroke-width="1.5"/>
  
  <!-- 左上六边形 -->
  <polygon points="20,8 32,15 32,29 20,36 8,29 8,15" fill="url(#honeyGrad2)" stroke="#E67E22" stroke-width="1.5" opacity="0.85"/>
  
  <!-- 右上六边形 -->
  <polygon points="44,8 56,15 56,29 44,36 32,29 32,15" fill="url(#honeyGrad2)" stroke="#E67E22" stroke-width="1.5" opacity="0.85"/>
  
  <!-- 左下六边形 -->
  <polygon points="20,36 32,43 32,57 20,64 8,57 8,43" fill="url(#honeyGrad2)" stroke="#E67E22" stroke-width="1.5" opacity="0.85"/>
  
  <!-- 右下六边形 -->
  <polygon points="44,36 56,43 56,57 44,64 32,57 32,43" fill="url(#honeyGrad2)" stroke="#E67E22" stroke-width="1.5" opacity="0.85"/>
  
  <!-- 中心小蜜蜂（简化版，代表被保护的软件） -->
  <ellipse cx="32" cy="28" rx="5" ry="4" fill="#2C3E50"/>
  <ellipse cx="32" cy="28" rx="3" ry="2.5" fill="#F1C40F"/>
  <line x1="30" y1="26" x2="30" y2="30" stroke="#2C3E50" stroke-width="0.8"/>
  <line x1="32" y1="25.5" x2="32" y2="30.5" stroke="#2C3E50" stroke-width="0.8"/>
  <line x1="34" y1="26" x2="34" y2="30" stroke="#2C3E50" stroke-width="0.8"/>
  <ellipse cx="28" cy="26" rx="2.5" ry="1.5" fill="#ECF0F1" opacity="0.7"/>
  <ellipse cx="36" cy="26" rx="2.5" ry="1.5" fill="#ECF0F1" opacity="0.7"/>
</svg>
