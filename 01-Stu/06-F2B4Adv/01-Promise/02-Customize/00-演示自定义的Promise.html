  <!-- 如下为研究.resolve函数时候使用的 -->
  <script>
    //如果接收一般值，promise成功，value就是这个值
    const p1 = Promise.resolve(2);
    //如果接收的是成功的promise，p2成功，value就是这个promise的value
    const p2 = Promise.resolve(Promise.resolve(2));
    //如果接收的是失败的promise，p3成功，reason就是这个promise的reason
    const p3 = Promise.resolve(Promise.reject(2));
    p1.then((value) => {
      console.log("p1", value);
    });
    p2.then((value) => {
      console.log("p2", value);
    });
    p3.catch((reason) => {
      console.log("p3", reason);
    });
  </script>
