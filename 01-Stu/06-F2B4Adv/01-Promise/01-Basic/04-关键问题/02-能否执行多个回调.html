<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="../favicon.png" type="image/x-icon">
    <title>02-能否执行多个回调</title>
</head>

<body>
    <!-- 
    2. 一个 promise指定多个成功 指定多个成功 /失败回调函数 , 都会调用吗 ?
        当 promise改变为对应状态时都会调用 
    -->
    <script>
        let p = new Promise((resolve, reject) => {
            // resolve('OK');
        });

        ///指定回调 - 1
        p.then(value => {
            console.log(value);
        });

        //指定回调 - 2
        p.then(value => {
            alert(value);
        });
    </script>
</body>

</html>
