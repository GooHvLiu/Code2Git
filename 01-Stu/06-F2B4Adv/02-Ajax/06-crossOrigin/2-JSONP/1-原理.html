<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>原理演示</title>
    <style>
      #result {
        width: 300px;
        height: 100px;
        border: solid 1px #78a;
      }
    </style>
  </head>

  <body>
    <div id="result"></div>
    <script>
      //处理数据
      function handle(data) {
        //获取 result 元素
        const result = document.getElementById("result");
        result.innerHTML = data.name;
      }
    </script>
    <!-- 下面是为了说明script可以自身实现跨域
            1. javascript实现跨域是通过自身属性实现的；
            2. 这个方法是程序员自己研究出来的跨域方式
    -->

  </body>
</html>
