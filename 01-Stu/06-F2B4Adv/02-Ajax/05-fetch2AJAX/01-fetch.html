<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>fetch-AJAX请求</title>
  </head>
  <body>
    <button>fetch-AJAX请求</button>
    <script>
      const btn = document.querySelector("button");
      btn.onclick = function () {
        fetch("http://127.0.0.1:8000/axio-fetch-json-server", {
          //请求方法
          method: "POST",
          //请求头
          headers: {
            name: "atguigu"
          },
          //请求体
          body: "username=admin&password=admin"
        })
          .then((res) => res.json())
          .then((data) => {
            console.log("fetch方法请求:", data);
          })
          .catch((err) => {
            console.error("fetch方法请求失败", err);
          });
      };
    </script>
  </body>
</html>
