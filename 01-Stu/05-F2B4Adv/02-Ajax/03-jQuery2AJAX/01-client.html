<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="stylesheet"
      href="https://cdn.staticfile.net/twitter-bootstrap/3.3.7/css/bootstrap.min.css"
    />
    <script src="https://cdn.bootcdn.net/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
    <title>jQuery-AJAX</title>
  </head>
  <body>
    <div class="container">
      <h2 class="page-header">jQuery发送AJAX请求</h2>
      <button class="btn btn-primary">GET</button>
      <button class="btn btn-danger">POST</button>
      <button class="btn btn-info">通用型AJAX</button>
    </div>
    <script>
      $("button")
        .eq(0)
        .click(function () {
          $.get(
            "http://127.0.0.1:8000/jquery-server",
            { a: 100, b: 200 },
            function (data) {
              console.log(data);
            },
          );
        });

      $("button")
        .eq(1)
        .click(function () {
          $.post(
            "http://127.0.0.1:8000/jquery-server",
            { a: 100, b: 200 },
            function (data) {
              console.log(data.name);
              console.log(data.address);
            },
            "json",
          );
        });

      $("button")
        .eq(2)
        .click(function () {
          $.ajax({
            // url
            url: "http://127.0.0.1:8000/jquery-json-server",
            // 参数
            data: { a: 100, b: 200 },
            // 请求类型
            type: "GET",
            //响应体结果
            dataType: "json",
            //成功的回调
            success: function (data) {
              console.log(
                "返回的name：",
                data.name,
                "；",
                "返回的address：",
                data.address,
              );
            },
            //超时时间
            timeout: 2000,
            //失败的回调
            error: function () {
              console.log("出错了~");
            },
          });
        });
    </script>
  </body>
</html>
