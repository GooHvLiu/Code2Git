<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="shortcut icon" href="../favicon.png" type="image/x-icon">
  <title>01-Promise的状态</title>
</head>

<body>
  <div style="margin: 5px 5px; padding-top: 15px;">
    <h2>
      Promise 的状态
    </h2>
    <div style="padding: 10px;">实例对象中的一个属性 『PromiseState』</div>
    <div style="padding: 10px;">* pending -未决定的</div>
    <div style="padding: 10px;"> * resolved / fullfilled -成功</div>
    <div style="padding: 10px;">* rejected -失败</div>
  </div>
  <div style="margin: 5px 5px; padding-top: 15px;">
    <h2>
      Promise 的状态改变
    </h2>
    <div style="padding: 10px;">1. pending变为 resolved</div>
    <div style="padding: 10px;">2. pending变为 rejected</div>
    <div style="padding: 10px;">说明 : 只有这 2种, 且一个 且一个 promise对象只能改变一次 对象只能改变一次
      无论变为成功还是失败 , 都会有一个结果数据
      成功的结果数据一般称为 value, 失败的结果数据一般称为 失败的结果数据一般称为 reason</div>
  </div>
</body>

</html>
