<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="shortcut icon" href="../../favicon.png" type="image/x-icon">
  <title>06.01-回顾Object.defineProperty方法</title>
</head>

<body>
  <script>
    let number = 19
    let person = {
      name: '张三',
      sex: '男'
    }
    Object.defineProperty(person, 'age', {
      // value: 18,
      // enumerable: true,//控制属性是否可枚举，默认false，不可枚举
      // writable: true,//控制属性是否可以修改，默认false，不可修改
      // configurable: true,//控制属性是否可以删除，默认false，不可删除

      //当有人读取person的age属性时，get函数（geter）就会被调用，且返回值就是age的值
      get() {
        return number
      },

      //当有人修改person的age属性时，set函数（seter）就会被调用，且返回值就是age的值
      set(value) {
        console.log('有人修改了age属性')
        number = value
      },
    })

    console.log(person)
  </script>
</body>

</html>
