<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="shortcut icon" href="../../favicon.png" type="image/x-icon">
  <title>08.03-姓名案例_计算属性实现</title>
  <!-- 引入script -->
  <script type="text/javascript" src="../../js_Tools/vue.js"></script>
</head>

<body>
  <!-- 
    计算属性：
      1.定义：要用的属性不存在，要通过已有属性计算得来。
      2.原理：底层借助了Object.defineproperty方法提供的getter和setter。
      3.get函数什么时候执行？
        3.1 初次读取时会被执行一次；
        3.2 当以来的数据发生改变时会被再次调用；
      4.优势：与methods实现相比，内部有缓存机制（复用），效率更高，调试方便。
      5.备注：
        5.1 计算属性最终会出现在vm身上，直接读取使用即可；
        5.2 如果计算属性要被修改，那必须写set函数去响应修改，且set中要引起计算时依赖的数据变化；
  -->
  <div id="root">
    <!-- "v-model:value=" = "v-model="" -->
    姓：<input type="text" v-model="firstName"><br><br>
    <!-- "v-model:value=" = "v-model="" -->
    名：<input type="text" v-model="lastName"><br><br>
    全名：<span>{{fullName}}</span><br><br>
  </div>
</body>
<script type="text/javascript">
  Vue.config.productionTip = false //阻止Vue在启动时生成生产提示。

  const vm = new Vue({
    el: "#root",
    //data是属性
    data: {
      firstName: '张',
      lastName: '三'
    },
    //computed是计算属性,本身是没有值的，实际需要的时候，马上计算或者设置
    computed: {
      fullName: {
        //get的作用：当有人查询fullName时，fullName就会调用get，get的返回值就是fullName的内容
        //get何时被调用：
        //1.初次读取fullname时；
        //2.所使用值发生变化时；
        get() {
          return this.firstName + "-" + this.lastName
        },

        //set何时被调用：
        //当fullname被修改时
        set(value) {
          //假定输入格式如下：
          //张-三
          //李-四
          const arr = value.split('-')
          this.firstName = arr[0]
          this.lastName = arr[1]
        }
      }
    }
  })
</script>

</html>
