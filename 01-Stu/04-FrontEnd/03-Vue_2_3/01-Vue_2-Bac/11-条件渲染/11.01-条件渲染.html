<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="shortcut icon" href="../../favicon.png" type="image/x-icon" />
    <title>11.01-条件渲染</title>
    <!-- 引入script -->
    <script type="text/javascript" src="../../js_Tools/vue.js"></script>
  </head>

  <body>
    <!-- 
      条件渲染：
        1.v-if
          写法：
              (1).v-if="表达式" 
              (2).v-else-if="表达式"
              (3).v-else="表达式"
          适用于：切换频率较低的场景。
          特点：不展示的DOM元素直接被移除。
          注意：v-if可以和:v-else-if、v-else一起使用，但要求结构不能被“打断”。

        2.v-show
          写法：v-show="表达式"
          适用于：切换频率较高的场景。
          特点：不展示的DOM元素未被移除，仅仅是使用样式隐藏掉
          
        3.备注：使用v-if的时，元素可能无法获取到，而使用v-show一定可以获取到。
		 -->
    <!-- 准备好一个容器 -->
    <div id="root">
      <!-- 使用v-show做条件渲染 元素还在，用display进行隐藏-->
      <!-- <h1 v-show="false">欢迎来到{{name}}</h1>
    <h1 v-show="1===1">欢迎来到{{name}}</h1> -->

      <!-- 使用v-if做条件渲染 元素直接被删除 -->
      <!-- <h1 v-if="false">欢迎来到{{name}}</h1>
    <h1 v-if="1===1">欢迎来到{{name}}</h1> -->

      <h2>当前的n值是：{{n}}</h2>
      <button @click="n++">点我+1</button>

      <br />
      <div v-if="n===1">HTML</div>
      <div v-else-if="n===2">CSS</div>
      <div v-else-if="n===3">javascript</div>
      <div v-else>Vue2_3</div>
    </div>

    <script type="text/javascript">
      Vue.config.productionTip = false; //阻止Vue在启动时生成生产提示。

      const vm = new Vue({
        el: "#root",
        data: {
          name: "BeiJing",
          n: 0
        }
      });
    </script>
  </body>
</html>
