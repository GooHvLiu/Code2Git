<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="shortcut icon" href="../../favicon.png" type="image/x-icon">
  <title>07.03-键盘事件</title>
  <!-- 引入script -->
  <script type="text/javascript" src="../../js_Tools/vue.js"></script>
</head>

<body>
  <!-- 
    1.Vue中常用的按键别名：
        回车 => enter
        删除 => delete（捕获“删除”和退格键）
        退出 => esc
        空格 => space
        换行 => tab（不适合keyup，适合keydown，因为keydown之后，就不聚焦当前标签了，所以keyup就不起作用了）
        上 => up
        下 => down
        左 => left
        右 => right
        CapsLock => caps-lock(例如这种多单词连接的词组，中间用-连接，前后词都是小写)

    2.Vue未提供别名的按键，可以使用按键原始的key值去绑定，但注意要转为kebab-case

    3.系统修饰键（用法特殊）：ctrl、alt、shift、meta(win)
      1).配合keyup使用：按下修饰键的同时，再按下其他键，随后释放其他键，事件才被触发。
      2).配合keydown使用：正常触发事件。
      3).系统修饰符后面可以再加按键，如：@keyup.ctrl.y="showInfo"表示在按下ctrl之后，还要继续按y才起作用。

    4.也可以使用keyCode去指定具体的按键（不推荐）

    5.Vue.config.keyCode.自定义键名 = 键码，可以去定制键盘别名
      Vue.config.keyCode.huiche=13 //绑定huiche是Enter按键的别名
  -->

  <!-- 准备好一个容器 -->
  <div id="root">
    <h1>欢迎来到{{name}}学习</h1>
    <input type="text" placeholder="请输入内容" @keyup.enter="showInfo">
  </div>
</body>
<script type="text/javascript">
  Vue.config.productionTip = false //阻止Vue在启动时生成生产提示。

  const vm = new Vue({
    el: '#root',
    data: {
      name: 'BeiJing'
    },
    methods: {
      showInfo(e) {
        console.log(e.target.value)
      }
    }
  })
</script>

</html>
