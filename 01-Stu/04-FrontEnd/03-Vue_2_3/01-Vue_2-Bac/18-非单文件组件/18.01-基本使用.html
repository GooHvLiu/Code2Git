<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <link rel="shortcut icon" href="../../favicon.png" type="image/x-icon" />
    <title> </title>
    <script type="text/javascript" src="../../js_Tools/vue.js"></script>
  </head>

  <body>
    <!-- 
    Vue中使用组件的三大步骤：
      一、定义组件(创建组件)
      二、注册组件
      三、使用组件(写组件标签)

    一、如何定义一个组件？
          使用Vue.extend(options)创建，其中options和new Vue(options)时传入的那个options几乎一样，但也有点区别；
          区别如下：
              1.el不要写，为什么？ ——— 最终所有的组件都要经过一个vm的管理，由vm中的el决定服务哪个容器。
              2.data必须写成函数，为什么？ ———— 避免组件被复用时，数据存在引用关系。
          备注：使用template可以配置组件结构。

    二、如何注册组件？
            1.局部注册：靠new Vue的时候传入components选项
            2.全局注册：靠Vue.component('组件名',组件)

    三、编写组件标签：
          <school></school>
		-->
    <!-- 准备好一个容器-->
    <div id="root">
      ---学校信息---
      <!-- 编辑非单文件组件标签 -->
      <school></school>
      ---学生信息---
      <!-- 编辑非单文件组件标签 -->
      <student></student>
      <!-- 编辑非单文件组件标签 -->
      <hello></hello>
    </div>
  </body>

  <script type="text/javascript">
    Vue.config.productionTip = false; //阻止 vue 在启动时生成生产提示。

    //第1步：创建school组件
    const school = Vue.extend({
      template: `
      <div>
        <h3>学校名称：{{schoolName}}</h3>
        <h3>学校地址：{{schoolAddress}}</h3>
      </div>
    `,
      data() {
        return {
          schoolName: "Changchun",
          schoolAddress: "WeixingGuangChang"
        };
      }
    });

    //第1步：创建student组件
    const student = Vue.extend({
      template: `
      <div>
        <h3>学生姓名：{{studentName}}</h3>
        <h3>学生年龄：{{studentAge}}</h3>
      </div>
    `,
      data() {
        return {
          studentName: "Sam",
          studentAge: "21"
        };
      }
    });

    // 第1步：创建Hello组件
    const hello = Vue.extend({
      template: `
      <div>
        <h3>Hello,{{helloName}}!</h3>
      </div>
    `,
      data() {
        return {
          helloName: "Vue"
        };
      }
    });

    //第2步：全局注册
    Vue.component("hello", hello);

    //第2步：注册组件
    vm = new Vue({
      el: "#root",
      components: {
        school,
        student
      }
    });
  </script>
</html>
