<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8" />
  <link rel="shortcut icon" href="../../favicon.png" type="image/x-icon">
  <title>12.06-Vue监测数据改变的原理</title>
  <script type="text/javascript" src="../../js_Tools/vue.js"></script>
</head>

<body>
  <!-- 准备好一个容器-->
  <div id="root">
    <h2>学校名称：{{name}}</h2>
    <h2>学校地址：{{address}}</h2>

  </div>

  <script type="text/javascript">
    Vue.config.productionTip = false

    new Vue({
      el: '#root',
      data: {
        name: 'BeiJing',
        address: 'suzhou'
      }
    })
  </script>
</body>

</html>
