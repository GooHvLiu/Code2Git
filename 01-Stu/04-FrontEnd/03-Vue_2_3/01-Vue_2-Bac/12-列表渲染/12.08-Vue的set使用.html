<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8" />
  <link rel="shortcut icon" href="../../favicon.png" type="image/x-icon">
  <title>12.08-Vue的set使用</title>
  <script type="text/javascript" src="../../js_Tools/vue.js"></script>
</head>

<body>
  <!-- 准备好一个容器-->
  <div id="root">
    <h1>学校信息</h1>
    <h2>名称：{{school.name}}</h2>
    <h2>地址：{{school.address}}</h2>
    <h2 v-if="school.sort">排名：{{school.sort}}</h2>
    <hr>
    <h1>学生信息</h1>
    <h2>姓名{{student.name}}</h2>
    <h2>年龄：真实{{student.age.rAge}}，对外{{student.age.sAge}}</h2>
    <h2>朋友们</h2>
    <ul>
      <li v-for="(f,index) in student.friends" :key="index">
        {{f.name}}--{{f.age}}
      </li>
    </ul>
  </div>

  <script type="text/javascript">
    Vue.config.productionTip = false

    vm = new Vue({
      el: '#root',
      data: {
        school: {
          name: 'BeiJing',
          address: 'suzhou',

        },
        student: {
          name: 'tom',
          age: {
            rAge: 40,
            sAge: 29,
          },
          friends: [
            { name: 'jerry', age: 35 },
            { name: 'tony', age: 36 }
          ]
        }
      }
    })
  </script>
</body>

</html>
