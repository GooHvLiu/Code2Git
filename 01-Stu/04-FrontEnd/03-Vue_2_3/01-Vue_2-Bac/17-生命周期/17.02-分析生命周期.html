<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8" />
  <link rel="shortcut icon" href="../../favicon.png" type="image/x-icon">
  <title>17.02-分析生命周期</title>
  <script type="text/javascript" src="../../js_Tools/vue.js"></script>
</head>

<body>

  <div id="root">
    <!-- 当Vue内没有template时 -->
    <button @click="add">当前的n的数值为：{{n}}</button>
    <br>
    <button @click="bye">点我销毁Vue实例</button>
    <br>
    <img src="./imgs/生命周期1.png" alt="" width="50%">
  </div>
</body>
<script>
  Vue.config.productionTip =

    vm = new Vue({
      el: '#root',
      //当有template时：
      //1）内部字符串一行如果可以写完，可以使用''包裹，其包裹内容就是html字段；
      //2）内部字符串一行不可以写完，只能使用``，模板字符串一样的字符包裹，其包裹内容就是html字段；
      //3) template内只能有一个根元素，即全部代码必须用一个块包裹
      //4）不推荐自行使用
      // template: `
      // <div>
      //   <button @click="add">当前的n的数值为：{{n}}</button>
      //   <br>
      //   <img src="./imgs/生命周期.png" alt="" width="50%">
      // </div>
      // `,
      data: {
        n: 1
      },
      methods: {
        add() {
          this.n++;
        },
        bye() {
          console.log('bye')
          this.$destroy()
        }
      },
      //初始化：生命周期、事件，但是数据代理还未开始
      beforeCreate() {
        console.log('beforeCreate')
        // console.log(this)
        // debugger;
      },
      // 初始化：数据监控、数据代理
      created() {
        console.log('created')
        // console.log(this)
        // debugger;
      },
      //页面呈现的是未经Vue编译的DOM结构，所有对DOM的操作，最终都不奏效
      beforeMount() {
        console.log('beforeMount')
        // console.log(this)
        // debugger;
      },
      //页面呈现的是经过Vue编译的DOM结构，所有对DOM的操作均有效（尽可能避免），至此，初始化过程完成
      mounted() {
        console.log('mounted')
        // console.log(this)
        // debugger;
      },
      //当任何参数发生改变时，触发此函数，此函数执行时，数据是新的，但是页面还没有刷新
      beforeUpdate() {
        console.log('beforeUpdate')
        // console.log(this.n)
        // debugger;
      },
      //当参数发生改变时，此函数执行时，数据是新的，页面刷新为新的
      updated() {
        console.log('updated')
        // console.log(this.n)
        // debugger;
      },
      //此时，vm中所有的data，methods，指令都处于可用状态，即将进行销毁过程
      beforeDestroy() {
        console.log('beforeDestroy')
        // console.log(this.n)
        // debugger;
      },

      destroyed() {
        console.log('destroyed')
        console.log(this.n)
        debugger;
      },
    })

</script>

</html>
