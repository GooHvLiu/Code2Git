<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="shortcut icon" href="../../favicon.png" type="image/x-icon">
  <title>09.02-天气案例_监事属性</title>
  <!-- 引入script -->
  <script type="text/javascript" src="../../js_Tools/vue.js"></script>
</head>

<body>
  <!-- 
    监视属性watch:
      1.当被监视的属性变化时，回调函数自动调用，进行相关操作
      2.监视的属性必须存在，才能进行监视！！
      3.监视的两种写法：
        3.1 new Vue时传入watch配置
        3.2 通过vm.$watch监视
  -->
  <div id="root">
    <h1>今天天气很{{info}}</h1>
    <button @click="changeWeather">切换天气</button>
    <!-- @xxx='y',其中y可以是vm里面的方法，也可以是简单的判断语句 -->
    <button @click="isHot = !isHot">切换天气</button>
  </div>
</body>
<script type="text/javascript">
  Vue.config.productionTip = false //阻止Vue在启动时生成生产提示。

  const vm = new Vue({
    el: "#root",
    data: {
      isHot: true
    },
    computed: {
      info() {
        return this.isHot ? '炎热' : '凉爽'
      }
    },
    methods: {
      changeWeather() {
        this.isHot = !this.isHot
      }
    },
    //前期创建时就非常明确要监视的变量
    watch: {
      isHot: {
        immediate: true, //初始化时，让handle调用一下
        //handle什么时候被调用？在isHot发生改变时
        handler(newValue, oldValue) {
          console.log('isHot被修改了', newValue, oldValue)
        }
      },
      info: {
        immediate: true, //初始化时，让handle调用一下
        //handle什么时候被调用？在info发生改变时
        handler(newValue, oldValue) {
          console.log('info被修改了', newValue, oldValue)
        }
      },
    }
  })

  //如下为外部监控，一般用于最初创建时不明确，后期明确增加的时候使用
  vm.$watch('isHot', {
    immediate: true,//初始化时，让handle调用一下
    //handle什么时候被调用？在info发生改变时
    handler(newValue, oldValue) {
      console.log('info被修改了', newValue, oldValue)
    }
  })

</script>

</html>
