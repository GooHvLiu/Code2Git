<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="shortcut icon" href="../../favicon.png" type="image/x-icon" />
    <title>04-el与data的两种写法</title>
    <!-- 引入script -->
    <script type="text/javascript" src="../../js_Tools/vue.js"></script>
  </head>

  <body>
    <!-- 
  data与el的2种写法
    1.el的2种写法
      （1）new Vue时候配置el属性。
      （2）先创建Vue实例，随后再通过vm.$mount('#root')指定el的值。
    2.data的2种写法
      （1）对象式
      （2）函数式
      如何选择：目前哪种写法都可以，以后学习到组件后，data必须使用函数式，否则会报错
    3.一个重要的原则：
      由Vue管理的函数，一定不要写箭头函数，一旦写了箭头函数，this就不再是Vue实例了，因为箭头函数没有this
-->
    <div id="root">
      <h1>你好,{{name}}</h1>
    </div>
  </body>
  <script type="text/javascript">
    Vue.config.productionTip = false; //阻止Vue在启动时生成生产提示。

    // el的第1种写法
    // new Vue({
    //   el: '#root',
    //   data: {
    //     name: 'BeiJing'
    //   }
    // })

    // el的第2种写法
    // 1.没有任何其他功能
    const x = new Vue({
      /* el: "#root",
      //以下为data的第1种写法：对象式
      data: {
        name: "BeiJing"
      } */

      // 以下为data的第2种写法：函数式
      data: function () {
        console.log("@@@", this); //此处的this是Vue实例对象，不可以用箭头函数，因为箭头函数没有this，会返回Windows对象的this
        return {
          name: "BeiJing"
        };
      }
    });
    // x.$mount('#root')
    // 2.增加一个定时器进行绑定,1秒之后再绑定
    setTimeout(() => {
      // $mount有挂载的意思，这里是指把容器#root挂载到new的Vue实例
      x.$mount("#root");
    }, 1000);
  </script>
</html>
