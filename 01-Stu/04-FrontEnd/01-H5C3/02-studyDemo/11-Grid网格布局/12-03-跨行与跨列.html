<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="shortcut icon" href="../favicon.png" type="image/x-icon">
  <title>12-03-跨行与跨列</title>
  <style>
    .grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);

    }

    .item {
      padding: 3rem;
      border: 1px #ccc solid;
      font-size: 1.3rem;
      font-weight: bold;
      text-align: center;
    }

    .item:first-child {
      /* grid-column-start表示该单元格左边网格线从第2条线开始  */
      /* grid-column-start: 1; */
      /* grid-column-start表示该单元格右边网格线从第4条线开始  */
      /* grid-column-end: 4; */
      /* 以上可以使用如下简写方式实现 1 /span 3表示该单元格横向（即列）横跨从第1个~第3个单元格*/
      grid-column: 1 /span 3;

      /* grid-column-start表示该单元格上边网格线从第2条线开始  */
      /* grid-row-start: 1; */
      /* grid-column-start表示该单元格下边网格线从第4条线开始  */
      /* grid-row-end: 4; */
      /* 以上可以使用如下简写方式实现 1 /span 3表示该单元格纵向（即行）横跨从第1个~第3个单元格*/
      grid-row: 1 /span 3;
    }

    .item:nth-child(9) {
      grid-column: 2/span 3;
      grid-row: 2/span 5;
    }
  </style>
</head>

<body>
  <div class="grid">
    <div class="item">Items 1</div>
    <div class="item">Items 2</div>
    <div class="item">Items 3</div>
    <div class="item">Items 4</div>
    <div class="item">Items 5</div>
    <div class="item">Items 6</div>
    <div class="item">Items 7</div>
    <div class="item">Items 8</div>
    <div class="item">Items 9</div>
    <div class="item">Items 10</div>
    <div class="item">Items 11</div>
    <div class="item">Items 12</div>
    <div class="item">Items 13</div>
    <div class="item">Items 14</div>
    <div class="item">Items 15</div>
  </div>
</body>

</html>
