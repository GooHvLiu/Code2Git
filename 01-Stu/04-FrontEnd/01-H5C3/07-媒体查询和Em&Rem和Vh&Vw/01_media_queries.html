<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="shortcut icon" href="../favicon.png" type="image/x-icon">
  <!-- 其他共同样式 -->
  <link rel="stylesheet" href="./css_media/style.css">
  <!-- mobile-移动端 -->
  <link rel="stylesheet" media="screen and (max-width:768px)" href="./css_media/mobile.css">
  <!-- tablet-平板 -->
  <link rel="stylesheet" media="screen and (min-width:769px) and (max-width:992px)" href="./css_media/tablet.css">
  <!-- desktop-桌面 -->
  <link rel="stylesheet" media="screen and (min-width:992px) and (max-width:1200px)" href="./css_media/desktop.css">
  <!-- largedesktop-大桌面 -->
  <link rel="stylesheet" media="screen and  (min-width:1201px)" href="./css_media/largedesktop.css">
  <title>Media Queries</title>
</head>

<body>
  <!-- 宽度≥ 1200px -->
  <div id="largedesktop">
    <h1>LargeDesktop-大桌面</h1>
  </div>
  <!-- 宽度≤ 1200px 且 宽度≥992px -->
  <div id="desktop">
    <h1>Desktop-桌面</h1>
  </div>
  <!-- 宽度≤ 992px 且 宽度≥768px -->
  <div id="tablet">
    <h1>Tablet-平板</h1>
  </div>
  <!-- 宽度≤ 768px -->
  <div id="mobile">
    <h1>Mobile-移动端</h1>
  </div>
</body>

</html>
