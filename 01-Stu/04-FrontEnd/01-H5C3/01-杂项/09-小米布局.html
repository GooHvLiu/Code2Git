<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>小米布局</title>
    <style>
        *{
            margin: 0;
            padding: 0;
        }
        .top{
            height: 40px;
            background-color: #333;
            margin: 0 auto;

        }

        .head{
            height: 100px;
            width: 1226px;
            background-color: #ffc0cb;
        }

        .container{
            height:460px;
            width: 1226px;
            background-color: #ff69b4;
        }

        .left{
            height: 460px;
            width: 234px;
            float: left;
            background-color: #ffa500;
        }

        .right{
            height: 460px;
            width: 992px;
            float: left;
            background-color: #87ceeb;
        }
    </style>
</head>
<body>
    <div class="top"></div>
    <div class="head"></div>
    <div class="container">
        <div class="left"></div>
        <div class="right"></div>
    </div>
</body>
</html>
