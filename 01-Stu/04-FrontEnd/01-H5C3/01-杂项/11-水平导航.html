<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>水平导航</title>
    <style>
        *{
            margin: 0;
            padding: 0;
        }

        .nav{
            background-color: #ffc0cb;
            height: 50px;
            margin-top: 150px;
            margin:auto;
        }

        .nav ui{
            list-style: none;

        }

        .nav ui li{
            float: left;
            
        }

        .nav ui li a{
            text-decoration: none;
            display: inline-block;
            width: 80px;
            color: white;
            text-align: center;
            line-height: 50px;
        }

        .nav ui li a:hover{
            background-color: #008000;
        }
    </style>
</head>
<body>
    <div class="nav">
        <ui>
            <li><a href="#">新闻1</a></li>
            <li><a href="#">新闻2</a></li>
            <li><a href="#">新闻3</a></li>
            <li><a href="#">新闻4</a></li>
            <li><a href="#">新闻5</a></li>
            <li><a href="#">新闻6</a></li>
            <li><a href="#">新闻7</a></li>
            <li><a href="#">新闻8</a></li>
        </ui>
    </div>
</body>
</html>
