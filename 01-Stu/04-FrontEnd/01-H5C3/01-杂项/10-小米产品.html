<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>小米产品</title>
    <style>
        *{
            margin: 0;
            padding: 0;
        }

        .box{
            width: 1226px;
            height: 614px;
            margin: 0 auto;
            margin-top: 100px;
            background-color: #1cc65a;

        }

        .left{
            float: left;
            width: 231px;
            height: 614px;
            background-color: #800080;
        }

        .right{
            float: right;
            width: 978px;
            height:614px;
            background-color: #e6dae7;
        }

        .right ul{
            list-style: none;
        }
        .right ul li{
            float:left ;
            width: 234px;
            height: 300px;   
            background-color: #87ceeb;
            margin-bottom: 14px;
            margin-right: 14px;
        }

        .right ul li:nth-child(4n){
            margin-right: 0;
        }
    </style>
</head>
<body>
    <div class="box">
        <div class="left"></div>
        <div class="right">
            <ul>
                <li></li>
                <li></li>
                <li></li>
                <li></li>
                <li></li>
                <li></li>
                <li></li>
                <li></li>
            </ul>
        </div>
    </div>
</body>
</html>
