<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    td {
      padding: 20px 40px;
      border: 1px orange solid;
    }

    tr:nth-child(even) {
      background-color: yellowgreen;
    }

    tr:nth-child(odd) {
      background-color: lightblue;
    }
  </style>
</head>

<body>
  <table>
    <tr>
      <td></td>
      <td></td>
      <td></td>
    </tr>
    <tr>
      <td></td>
      <td></td>
      <td></td>
    </tr>
    <tr>
      <td></td>
      <td></td>
      <td></td>
    </tr>
    <tr>
      <td></td>
      <td></td>
      <td></td>
    </tr>
  </table>
</body>
<script>
  //获取所有的td
  let tds = document.querySelectorAll('td');

  //遍历
  tds.forEach(item => {
    item.onclick = function () {
      this.style.background = 'black';
    }
  })
</script>

</html>
