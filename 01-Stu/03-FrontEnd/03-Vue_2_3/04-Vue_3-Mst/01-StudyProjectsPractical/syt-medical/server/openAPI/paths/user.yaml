# 用户中心模块接口
# 前缀：/api/user

/api/user/userInfo/login:
  post:
    tags: [用户中心]
    summary: 手机号验证码登录
    description: |
      使用手机号 + 短信验证码登录。
      - 测试验证码：`111111`（任意手机号均可通过）
      - 新手机号自动注册
      - 登录成功返回 token，后续需认证接口在请求头携带 `token` 字段
    operationId: login
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/LoginRequest"
          examples:
            登录:
              value:
                phone: "13800000001"
                code: "111111"
    responses:
      "200":
        description: 登录成功
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/ResponseWrapper"
                - type: object
                  properties:
                    data:
                      $ref: "#/components/schemas/LoginResponse"
            examples:
              登录成功:
                value:
                  code: 200
                  message: "成功"
                  ok: true
                  data:
                    token: "mock_token_1_1726000000000_abc123"
                    name: "测试用户"
      "201":
        description: 登录失败（验证码错误/账号禁用）
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ErrorResponse"
            examples:
              验证码错误:
                value:
                  code: 201
                  message: "验证码错误"
                  ok: false
                  data: null
              账号禁用:
                value:
                  code: 201
                  message: "账号已被禁用"
                  ok: false
                  data: null

/api/user/userInfo/getUserInfo:
  get:
    tags: [用户中心]
    summary: 获取当前登录用户信息
    description: 需要登录认证，返回当前用户的完整信息。
    operationId: getUserInfo
    security:
      - BearerAuth: []
    responses:
      "200":
        description: 获取成功
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/ResponseWrapper"
                - type: object
                  properties:
                    data:
                      $ref: "#/components/schemas/UserInfo"
      "208":
        description: 未登录
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ErrorResponse"

/api/user/userInfo/authUser:
  post:
    tags: [用户中心]
    summary: 实名认证
    description: |
      提交真实姓名和证件信息完成实名认证。
      Mock 环境直接认证通过（authStatus=2）。
    operationId: authUser
    security:
      - BearerAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/AuthUserRequest"
          examples:
            实名认证:
              value:
                name: "张伟"
                certificatesType: "1"
                certificatesNo: "110101199003152345"
    responses:
      "200":
        description: 认证成功
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResponseWrapper"
            examples:
              成功:
                value:
                  code: 200
                  message: "实名认证成功"
                  ok: true
                  data: null
      "201":
        description: 参数不全
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ErrorResponse"
      "208":
        description: 未登录
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ErrorResponse"

/api/user/userInfo/auth/wxLogin:
  get:
    tags: [用户中心]
    summary: 微信扫码登录
    description: Mock 环境暂不支持微信登录，返回提示请使用手机号登录。
    operationId: wxLogin
    responses:
      "201":
        description: 不支持微信登录
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ErrorResponse"
            examples:
              提示:
                value:
                  code: 201
                  message: "请使用手机号登录"
                  ok: false
                  data: null

/api/user/userInfo/logout:
  post:
    tags: [用户中心]
    summary: 退出登录
    description: 清除当前 token，退出登录状态。
    operationId: logout
    security:
      - BearerAuth: []
    responses:
      "200":
        description: 退出成功
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResponseWrapper"

/api/user/patient/findAll:
  get:
    tags: [用户中心]
    summary: 查询当前用户所有就诊人
    description: 返回当前登录用户名下的所有就诊人列表。
    operationId: findAllPatients
    security:
      - BearerAuth: []
    responses:
      "200":
        description: 查询成功
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/ResponseWrapper"
                - type: object
                  properties:
                    data:
                      type: array
                      items:
                        $ref: "#/components/schemas/Patient"
      "208":
        description: 未登录
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ErrorResponse"

/api/user/patient/get/{id}:
  get:
    tags: [用户中心]
    summary: 根据ID查询就诊人
    description: 查询指定就诊人的详细信息，只能查询当前用户的就诊人。
    operationId: getPatient
    security:
      - BearerAuth: []
    parameters:
      - name: id
        in: path
        required: true
        description: 就诊人ID
        schema:
          type: integer
          example: 1
    responses:
      "200":
        description: 查询成功
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/ResponseWrapper"
                - type: object
                  properties:
                    data:
                      $ref: "#/components/schemas/Patient"
      "201":
        description: 就诊人不存在
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ErrorResponse"
      "208":
        description: 未登录
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ErrorResponse"

/api/user/patient/save:
  post:
    tags: [用户中心]
    summary: 新增就诊人
    description: 为当前用户新增一个就诊人，返回新就诊人ID。
    operationId: savePatient
    security:
      - BearerAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/PatientSaveRequest"
          examples:
            新增:
              value:
                name: "张伟"
                certificatesType: "1"
                certificatesNo: "110101199003152345"
                sex: 1
                birthDate: "1990-03-15"
                phone: "13800000001"
                isInsure: 1
                cardNo: "110101199003152345"
                address: "北京市东城区"
    responses:
      "200":
        description: 新增成功
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/ResponseWrapper"
                - type: object
                  properties:
                    data:
                      type: integer
                      description: 新就诊人ID
                      example: 21
      "208":
        description: 未登录
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ErrorResponse"

/api/user/patient/update:
  put:
    tags: [用户中心]
    summary: 修改就诊人
    description: 修改当前用户名下指定就诊人的信息，请求体需包含 id。
    operationId: updatePatient
    security:
      - BearerAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/PatientSaveRequest"
          examples:
            修改:
              value:
                id: 1
                name: "张伟"
                certificatesType: "1"
                certificatesNo: "110101199003152345"
                sex: 1
                birthDate: "1990-03-15"
                phone: "13800000001"
                isInsure: 1
                address: "北京市朝阳区"
    responses:
      "200":
        description: 修改成功
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResponseWrapper"
      "201":
        description: 就诊人不存在
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ErrorResponse"
      "208":
        description: 未登录
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ErrorResponse"

/api/user/patient/delete/{id}:
  delete:
    tags: [用户中心]
    summary: 删除就诊人
    description: 逻辑删除当前用户名下的就诊人（isDeleted=1）。
    operationId: deletePatient
    security:
      - BearerAuth: []
    parameters:
      - name: id
        in: path
        required: true
        description: 就诊人ID
        schema:
          type: integer
          example: 1
    responses:
      "200":
        description: 删除成功
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResponseWrapper"
      "201":
        description: 就诊人不存在
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ErrorResponse"
      "208":
        description: 未登录
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ErrorResponse"
