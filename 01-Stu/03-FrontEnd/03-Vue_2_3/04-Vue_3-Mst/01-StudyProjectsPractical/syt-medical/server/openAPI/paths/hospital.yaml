      - name: scheduleId
        in: path
        required: true
        description: 排班ID
        schema:
          type: string
          example: "sch_1"
    responses:
      "200":
        description: 查询成功
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/ResponseWrapper"
                - type: object
                  properties:
                    data:
                      $ref: "#/components/schemas/Schedule"
      "404":
        description: 排班不存在
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ErrorResponse"

/api/hosp/hospital/show/{hoscode}/{depcode}/{scheduleId}:
  get:
    tags: [医院管理]
    summary: 预约挂号详情页数据
    description: 预约挂号确认页所需的完整数据，包含医院信息、科室名称、排班信息。
    operationId: showBookingDetail
    parameters:
      - name: hoscode
        in: path
        required: true
        schema:
          type: string
          example: "1000_0"
      - name: depcode
        in: path
        required: true
        schema:
          type: string
          example: "dept_neike_xinnao"
      - name: scheduleId
        in: path
        required: true
        schema:
          type: string
          example: "sch_1"
    responses:
      "200":
        description: 查询成功
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/ResponseWrapper"
                - type: object
                  properties:
                    data:
                      $ref: "#/components/schemas/BookingDetail"
      "404":
        description: 排班不存在
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ErrorResponse"

/api/hosp/hospital/auth/userAuth:
  post:
    tags: [医院管理]
    summary: 提交预约挂号
    description: |
      选择就诊人和排班后提交预约，创建待支付订单。
      需要登录认证。提交后号源自动扣减。
    operationId: submitBooking
    security:
      - BearerAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/OrderSubmitRequest"
          examples:
            提交预约:
              value:
                scheduleId: "sch_1"
                patientId: 1
    responses:
      "200":
        description: 预约成功，返回订单ID
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/ResponseWrapper"
                - type: object
                  properties:
                    data:
                      type: integer
                      description: 新创建的订单ID
                      example: 33
            examples:
              预约成功:
                value:
                  code: 200
                  message: "预约成功"
                  ok: true
                  data: 33
      "201":
        description: 预约失败（号源已满/就诊人不存在）
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ErrorResponse"
            examples:
              号源已满:
                value:
                  code: 201
                  message: "号源已约满"
                  ok: false
                  data: null
              就诊人不存在:
                value:
                  code: 201
                  message: "就诊人不存在"
                  ok: false
                  data: null
      "208":
        description: 未登录
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ErrorResponse"
