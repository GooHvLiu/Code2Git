# 短信服务模块接口
# 前缀：/api/user/msm

/api/user/msm/send/{phone}:
  get:
    tags: [短信服务]
    summary: 发送短信验证码
    description: |
      向指定手机号发送6位数字验证码。
      Mock 环境不真实发送，验证码打印在后端控制台。
      测试专用验证码：`111111`（任意手机号均可通过登录校验）。
    operationId: sendSmsCode
    parameters:
      - name: phone
        in: path
        required: true
        description: 手机号
        schema:
          type: string
          pattern: "^1[3-9]\\d{9}$"
          example: "13800000001"
    responses:
      "200":
        description: 发送成功
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResponseWrapper"
            examples:
              成功:
                value:
                  code: 200
                  message: "发送成功"
                  ok: true
                  data: null
      "201":
        description: 手机号格式不正确
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ErrorResponse"
            examples:
              格式错误:
                value:
                  code: 201
                  message: "手机号格式不正确"
                  ok: false
                  data: null
