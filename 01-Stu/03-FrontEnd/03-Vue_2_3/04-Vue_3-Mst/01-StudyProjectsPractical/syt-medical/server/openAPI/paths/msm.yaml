# 短信服务模块接口
# 前缀：/api/user/msm

/api/user/msm/send:
  post:
    tags: [短信服务]
    summary: 发送短信验证码
    description: |
      向指定手机号发送6位数字短信验证码。

      **安全策略（大厂规范）：**
      - 手机号格式严格校验（1开头，第2位3-9，共11位）
      - 同一手机号 60 秒内只能发送一次
      - 同一手机号每日最多发送 10 次
      - 验证码 5 分钟内有效，一次性使用
      - Mock 环境响应中返回验证码（仅用于测试）

      **Mock 环境说明：**
      - 不真实发送短信，验证码打印在后端控制台
      - 固定测试验证码：`111111`（任意手机号、任意时刻均可通过登录校验）
      - 响应 data 中返回 `{ code: "111111" }`，方便前端调试
    operationId: sendSmsCode
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [phone]
            properties:
              phone:
                type: string
                description: 手机号
                pattern: "^1[3-9]\\d{9}$"
                example: "13800000001"
          examples:
            正常请求:
              value:
                phone: "13800000001"
    responses:
      "200":
        description: 发送成功
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResponseWrapper"
            examples:
              发送成功:
                value:
                  code: 200
                  message: "验证码发送成功，请注意查收（仅用于测试）"
                  ok: true
                  data:
                    code: "111111"
      "201":
        description: 发送失败（参数错误/频率限制/每日上限）
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ErrorResponse"
            examples:
              手机号为空:
                value:
                  code: 201
                  message: "手机号不能为空"
                  ok: false
                  data: null
              手机号格式错误:
                value:
                  code: 201
                  message: "手机号格式不正确，请输入11位有效手机号"
                  ok: false
                  data: null
              发送过于频繁:
                value:
                  code: 201
                  message: "发送过于频繁，请45秒后重试"
                  ok: false
                  data: null
              今日次数已达上限:
                value:
                  code: 201
                  message: "今日验证码发送次数已达上限（10次），请明天再试"
                  ok: false
                  data: null

/api/user/msm/send/{phone}:
  get:
    tags: [短信服务]
    summary: 发送短信验证码（旧版，已废弃）
    description: |
      **已废弃（Deprecated）**，请使用 `POST /api/user/msm/send`。

      保留此接口仅为兼容旧前端代码，功能与 POST 版本一致，同样受频率限制和每日上限约束。
    operationId: sendSmsCodeLegacy
    deprecated: true
    parameters:
      - name: phone
        in: path
        required: true
        description: 手机号
        schema:
          type: string
          pattern: "^1[3-9]\\d{9}$"
          example: "13800000001"
    responses:
      "200":
        description: 发送成功
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResponseWrapper"
            examples:
              成功:
                value:
                  code: 200
                  message: "验证码发送成功，请注意查收（仅用于测试）"
                  ok: true
                  data:
                    code: "111111"
      "201":
        description: 发送失败
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ErrorResponse"
            examples:
              格式错误:
                value:
                  code: 201
                  message: "手机号格式不正确，请输入11位有效手机号"
                  ok: false
                  data: null
