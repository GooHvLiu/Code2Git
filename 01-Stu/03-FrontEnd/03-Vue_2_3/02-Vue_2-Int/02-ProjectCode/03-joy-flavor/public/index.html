<!DOCTYPE html>
<html lang="">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1.0,maximum-scale=1.0,minimum-scale=1.0,u
ser-scalable=no"
    />
    <link rel="stylesheet" href="/static/css/reset.css" />
    <!-- 引入已经打包 ok 的字体图标库 -->
    <link rel="stylesheet"href="////at.alicdn.com/t/c/font_5213519_hj0b1zi4525.css"></link>
    <!-- 引入FastClick CDN库 ,解决移动端点击 0.3s 延迟-->
    <script src="https://as.alipayobjects.com/g/component/fastclick/1.0.6/fastclick.js"></script>
    <script>
      // 判断浏览器支持addEventListener
      if ("addEventListener" in document) {
        // DOM加载完成后初始化FastClick
        document.addEventListener(
          "DOMContentLoaded",
          function () {
            // 给body绑定FastClick，消除300ms点击延迟
            FastClick.attach(document.body);
          },
          false
        );
      }
    </script>
    <link rel="icon" href="<%= BASE_URL %>favicon.ico" />
    <title>悦味点餐</title>
  </head>
  <body>
    <noscript>
      <strong
        >We're sorry but <%= htmlWebpackPlugin.options.title %> doesn't work
        properly without JavaScript enabled. Please enable it to
        continue.</strong
      >
    </noscript>
    <div id="app"></div>
    <!-- built files will be auto injected -->
  </body>
</html>
