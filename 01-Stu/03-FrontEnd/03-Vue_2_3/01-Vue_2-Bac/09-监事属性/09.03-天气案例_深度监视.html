<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="shortcut icon" href="../../favicon.png" type="image/x-icon" />
    <title>09.03-天气案例_深度监视</title>
    <!-- 引入script -->
    <script type="text/javascript" src="../../js_Tools/vue.js"></script>
  </head>

  <body>
    <!-- 
    深度监视：
      1.Vue中的watch默认不监视对象内部值的变化（只监视1层，多层不监视）
      2.配置deep:true后就可以监视对象内部值的变化（多层监视）
    备注：
      1.Vue自带可以监视对象内部值的改变。但Vue提供的watch默认不可以；
      2.使用watch时根据数据的具体结构，决定是否采用深度监视。
  -->
    <div id="root">
      <h1>今天天气很{{info}}</h1>
      <button @click="changeWeather">切换天气</button>
      <button @click="isHot = !isHot">切换天气</button>
      <br />
      <h3>a的值是：{{numbers.a}}</h3>
      <button @click="numbers.a++">点我让a+1</button>
    </div>

    <script type="text/javascript">
      Vue.config.productionTip = false; //阻止Vue在启动时生成生产提示。

      const vm = new Vue({
        el: "#root",
        data: {
          isHot: true,
          numbers: {
            a: 1,
            b: 1
          }
        },
        computed: {
          info() {
            return this.isHot ? "炎热" : "凉爽";
          }
        },
        methods: {
          changeWeather() {
            this.isHot = !this.isHot;
          }
        },
        watch: {
          isHot: {
            immediate: true,
            handler(newValue, oldValue) {
              console.log("isHot被修改了", newValue, oldValue);
            }
          },
          // 监视多级结构中某个属性的变化
          // 'numbers.a': {
          //   immediate: true,
          //   handler(newValue, oldValue) {
          //     console.log('number.a被修改了', newValue, oldValue)
          //   }
          // }

          //监视多级结构中所有属性的变化
          numbers: {
            deep: true,
            handler() {
              console.log("numbers被改变了");
            }
          }
        }
      });
    </script>
  </body>
</html>
