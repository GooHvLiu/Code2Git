<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="../favicon.png" type="image/x-icon">
    <title>确认页面</title>
    <style>
        * {
            margin: 0;
            padding: 0;
        }

        .box {
            margin: auto;
            height: 350px;
            width: 300px;
            background-color: #EEEEEE;
        }

        .content {
            padding-top: 15px;
            padding-left: 25px;

        }

        p {
            font-size: 20px;
            margin: 20px 0;
        }

        .cancelpay {
            margin: auto;
            width: 200px;
            background-color: #ff0000;
        }

        .cancelpay .cancel {
            float: left;
        }

        .cancelpay .pay {
            float: right;
        }

        .cancelpay button {
            padding: 5px 5px;
        }
    </style>
</head>

<body>
    <div class="box">
        <div class="content">
            <p>商品：Web前端课程</p>
            <p>原价：1980元</p>
            <p>现价：1.98元</p>
            <p>内容：HTML、CSS、JS</p>
            <p>地址：北京市朝阳区</p>
        </div>
        <div class="cancelpay">
            <button class="cancel">
                取消
            </button>
            <button class="pay">
                支付
            </button>
        </div>
    </div>

    <script>
        // 点击取消时，页面返回百度页面
        document.getElementsByClassName("cancel")[0].onclick = function () {
            location.href = 'http://www.baidu.com';
        }
        // 点击支付页面时，页面进入支付页面
        document.getElementsByClassName("pay")[0].onclick = function () {
            let res = window.confirm('您确定要支付么？');
            if (res) {
                location.href = './succ.html'
            }
        }
    </script>
</body>

</html>
